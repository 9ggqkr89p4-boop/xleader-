<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X Intelligence Center</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
--bg:#060816;
--card:#101526;
--card2:#151c31;
--line:#232b47;
--gold:#ffd54f;
--blue:#4da3ff;
--green:#00ff99;
--red:#ff5c7c;
--text:#f5f7ff;
--muted:#7d89b0;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Inter,sans-serif;
background:radial-gradient(circle at top,#13203f 0%,#060816 55%);
color:var(--text);
min-height:100vh;
overflow-x:hidden;
}

.topbar{
padding:28px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid var(--line);
background:rgba(6,8,22,.85);
backdrop-filter:blur(12px);
position:sticky;
top:0;
z-index:50;
}

.logo{
font-family:Orbitron,sans-serif;
font-size:2rem;
font-weight:900;
letter-spacing:3px;
background:linear-gradient(90deg,var(--gold),#fff5bf);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.live{
display:flex;
align-items:center;
gap:10px;
font-size:.85rem;
color:var(--green);
}

.dot{
width:10px;
height:10px;
background:var(--green);
border-radius:50%;
box-shadow:0 0 15px var(--green);
animation:pulse 1.5s infinite;
}

@keyframes pulse{
50%{
transform:scale(1.5);
opacity:.5;
}
}

.wrap{
padding:25px;
max-width:1500px;
margin:auto;
}

.hero{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:18px;
margin-bottom:25px;
}

.stat{
background:linear-gradient(180deg,var(--card),var(--card2));
border:1px solid var(--line);
padding:22px;
border-radius:20px;
position:relative;
overflow:hidden;
}

.stat::before{
content:'';
position:absolute;
top:0;
left:0;
right:0;
height:3px;
background:linear-gradient(90deg,var(--gold),var(--blue));
}

.stat h3{
font-size:.8rem;
letter-spacing:2px;
color:var(--muted);
margin-bottom:12px;
}

.stat .num{
font-size:2rem;
font-weight:800;
}

.grid{
display:grid;
grid-template-columns:1.4fr .9fr;
gap:22px;
}

.panel{
background:rgba(16,21,38,.85);
border:1px solid var(--line);
border-radius:24px;
padding:22px;
backdrop-filter:blur(16px);
}

.panel-title{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.panel-title h2{
font-size:1rem;
letter-spacing:2px;
font-weight:700;
}

.refresh{
padding:10px 18px;
background:linear-gradient(90deg,var(--gold),#ffb300);
border:none;
border-radius:12px;
font-weight:700;
cursor:pointer;
}

.rank-list{
display:flex;
flex-direction:column;
gap:14px;
}

.card{
background:linear-gradient(180deg,#131b31,#0f1527);
border:1px solid var(--line);
border-radius:18px;
padding:16px;
display:flex;
align-items:center;
justify-content:space-between;
transition:.25s;
}

.card:hover{
transform:translateY(-3px);
border-color:var(--blue);
}

.left{
display:flex;
align-items:center;
gap:14px;
}

.rank{
font-size:1.2rem;
font-weight:900;
width:40px;
text-align:center;
color:var(--gold);
}

.avatar{
width:54px;
height:54px;
border-radius:50%;
object-fit:cover;
border:2px solid var(--blue);
}

.name{
font-weight:700;
font-size:1rem;
}

.handle{
color:var(--muted);
font-size:.85rem;
margin-top:3px;
}

.right{
display:flex;
gap:18px;
}

.metric{
text-align:center;
}

.metric .v{
font-size:1rem;
font-weight:800;
}

.metric .k{
font-size:.7rem;
color:var(--muted);
margin-top:4px;
letter-spacing:1px;
}

.green{
color:var(--green);
}

.red{
color:var(--red);
}

.gold{
color:var(--gold);
}

.chart-box{
height:340px;
}

.footer{
padding:25px;
text-align:center;
color:var(--muted);
font-size:.8rem;
}

@media(max-width:1000px){
.grid{
grid-template-columns:1fr;
}
}

</style>
</head>

<body>

<div class="topbar">
<div class="logo">X INTELLIGENCE CENTER</div>

<div class="live">
<div class="dot"></div>
<div id="last-update">LIVE TRACKING</div>
</div>
</div>

<div class="wrap">

<div class="hero">

<div class="stat">
<h3>TOTAL MEMBERS</h3>
<div class="num" id="members">0</div>
</div>

<div class="stat">
<h3>TOTAL POSTS</h3>
<div class="num" id="posts">0</div>
</div>

<div class="stat">
<h3>TOTAL FOLLOWERS</h3>
<div class="num" id="followers">0</div>
</div>

<div class="stat">
<h3>ACTIVE TODAY</h3>
<div class="num" id="active">0</div>
</div>

</div>

<div class="grid">

<div class="panel">

<div class="panel-title">
<h2>LIVE TEAM RANKINGS</h2>
<button class="refresh" onclick="fetchData()">REFRESH</button>
</div>

<div class="rank-list" id="rankings"></div>

</div>

<div class="panel">

<div class="panel-title">
<h2>FOLLOWER ANALYTICS</h2>
</div>

<div class="chart-box">
<canvas id="followersChart"></canvas>
</div>

</div>

</div>

</div>

<div class="footer">
LIVE X DASHBOARD · AUTO REFRESH EVERY 60 SECONDS
</div>

<script>

let team=[];

function format(n){
if(!n) return "0";
if(n>=1000000) return (n/1000000).toFixed(1)+"M";
if(n>=1000) return (n/1000).toFixed(1)+"K";
return n.toString();
}

async function fetchData(){

try{

const res = await fetch('/.netlify/functions/xapi');
const data = await res.json();

team = data.data || [];

saveSnapshot(team);

renderStats();
renderCards();
renderChart();

document.getElementById('last-update').innerText =
'UPDATED ' + new Date().toLocaleTimeString();

}catch(e){
console.error(e);
}

}

function saveSnapshot(users){

const old = JSON.parse(localStorage.getItem('x_history') || '{}');

const now = Date.now();

users.forEach(u=>{

if(!old[u.username]) old[u.username] = [];

old[u.username].push({
time: now,
followers: u.public_metrics.followers_count,
tweets: u.public_metrics.tweet_count
});

if(old[u.username].length > 1440){
old[u.username].shift();
}

});

localStorage.setItem('x_history', JSON.stringify(old));

}

function getGrowth(username){

const data = JSON.parse(localStorage.getItem('x_history') || '{}');

if(!data[username] || data[username].length < 2){
return 0;
}

const arr = data[username];

return arr[arr.length-1].followers -
arr[arr.length-2].followers;

}

function renderStats(){

const posts = team.reduce((a,b)=>a+b.public_metrics.tweet_count,0);

const followers = team.reduce((a,b)=>a+b.public_metrics.followers_count,0);

document.getElementById('members').innerText = team.length;

document.getElementById('posts').innerText = format(posts);

document.getElementById('followers').innerText = format(followers);

const active = team.filter(u=>getGrowth(u.username) > 0).length;

document.getElementById('active').innerText = active;

}

function renderCards(){

const box = document.getElementById('rankings');

team.sort((a,b)=>
(b.public_metrics.followers_count + b.public_metrics.tweet_count)
-
(a.public_metrics.followers_count + a.public_metrics.tweet_count)
);

box.innerHTML = '';

team.forEach((u,i)=>{

const growth = getGrowth(u.username);

box.innerHTML +=  <div class="card">  <div class="left">  <div class="rank">#${i+1}</div>  <img class="avatar" src="${u.profile_image_url.replace('_normal','_200x200')}">  <div> <div class="name">${u.name}</div> <div class="handle">@${u.username}</div> </div>  </div>  <div class="right">  <div class="metric"> <div class="v gold">${format(u.public_metrics.followers_count)}</div> <div class="k">FOLLOWERS</div> </div>  <div class="metric"> <div class="v">${format(u.public_metrics.tweet_count)}</div> <div class="k">POSTS</div> </div>  <div class="metric"> <div class="v ${growth>=0?'green':'red'}"> ${growth>=0?'+':''}${growth} </div> <div class="k">LIVE Δ</div> </div>  </div>  </div> ;

});

}

let chart;

function renderChart(){

const ctx = document.getElementById('followersChart');

if(chart) chart.destroy();

chart = new Chart(ctx,{
type:'bar',
data:{
labels:team.map(u=>u.name),
datasets:[{
data:team.map(u=>u.public_metrics.followers_count),
borderWidth:1
}]
},
options:{
responsive:true,
plugins:{
legend:{display:false}
},
scales:{
x:{
ticks:{color:'#7d89b0'}
},
y:{
ticks:{color:'#7d89b0'}
}
}
}
});

}

fetchData();

setInterval(fetchData,60000);

</script>

</body>
</html>

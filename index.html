<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>𝕏 COMMAND CENTER · ULTRA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg-deep: #05050f; --bg-surface: #0a0a18; --bg-card: #0f0f20; --border-dim: #1a1a30;
  --gold: #f5b042; --accent-cyan: #2dd4bf; --text-main: #ededf5; --text-muted: #6b6b8f;
}
body { background: var(--bg-deep); color: var(--text-main); font-family: 'Inter', sans-serif; overflow-x: hidden; }
.bg-aura { position: fixed; inset: 0; background: radial-gradient(circle at 20% 30%, rgba(45,212,191,0.06), transparent 80%); pointer-events: none; z-index: 0; }
.content { position: relative; z-index: 2; max-width: 1400px; margin: 0 auto; padding: 1rem; }
.hero { text-align: center; padding: 2rem 1rem 1rem; border-bottom: 1px solid var(--border-dim); margin-bottom: 1.5rem; }
.hero h1 { font-family: 'Space Grotesk', sans-serif; font-size: 2.5rem; background: linear-gradient(135deg, var(--gold), var(--accent-cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 15px rgba(245,176,66,0.3); }
.badge-live { display: inline-flex; align-items: center; gap: 6px; background: rgba(45,212,191,0.1); border: 1px solid rgba(45,212,191,0.3); border-radius: 40px; padding: 0.2rem 1rem; font-size: 0.7rem; margin-top: 0.5rem; }
.refresh-btn { margin-left: 12px; background: rgba(245,176,66,0.2); border: 1px solid var(--gold); color: var(--gold); border-radius: 40px; padding: 0.2rem 1rem; font-size: 0.7rem; cursor: pointer; font-weight: 600; }
.refresh-btn:hover { background: var(--gold); color: black; }
.dot { width: 8px; height: 8px; background: var(--accent-cyan); border-radius: 50%; box-shadow: 0 0 8px var(--accent-cyan); }
.stats-2row { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem; }
.alltime-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1px; background: var(--border-dim); border-radius: 20px; overflow: hidden; }
.stat-brick { background: var(--bg-surface); padding: 1.2rem; text-align: center; }
.stat-number { font-family: 'Space Grotesk', monospace; font-size: 1.8rem; font-weight: 700; color: var(--gold); }
.stat-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); margin-top: 6px; }
.daily-team-stats { background: linear-gradient(145deg, var(--bg-card), var(--bg-surface)); border-radius: 20px; border: 1px solid var(--border-dim); padding: 1rem; }
.daily-title { font-size: 0.7rem; letter-spacing: 3px; color: var(--text-muted); margin-bottom: 0.8rem; }
.daily-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.daily-metric { background: rgba(0,0,0,0.3); border-radius: 14px; padding: 0.6rem; text-align: center; }
.daily-value { font-size: 1.3rem; font-weight: 700; color: var(--accent-cyan); }
.tab-nav { display: flex; gap: 6px; background: var(--bg-surface); padding: 0.5rem; border-radius: 50px; margin-bottom: 1.5rem; justify-content: center; border: 1px solid var(--border-dim); flex-wrap: wrap; }
.tab-btn { background: transparent; border: none; padding: 0.6rem 1.2rem; font-family: 'Space Grotesk', monospace; font-weight: 600; font-size: 0.8rem; color: var(--text-muted); border-radius: 40px; cursor: pointer; }
.tab-btn.active { background: var(--gold); color: #000; box-shadow: 0 0 12px rgba(245,176,66,0.4); }
.ranking-panel { display: none; }
.ranking-panel.active-panel { display: block; }
.rank-container { display: flex; flex-direction: column; gap: 10px; }
.rank-card { background: var(--bg-card); border: 1px solid var(--border-dim); border-radius: 24px; overflow: hidden; transition: transform 0.2s; }
.rank-card:hover { transform: translateX(4px); border-color: var(--gold); }
.card-inner { display: flex; align-items: center; padding: 1rem; gap: 12px; flex-wrap: wrap; }
.rank-number { font-family: 'Space Grotesk'; font-weight: 800; font-size: 1.4rem; min-width: 40px; text-align: center; color: var(--text-muted); }
.avatar { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--gold); background: #1a1a2e; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.user-info { flex: 2; min-width: 140px; }
.user-name { font-weight: 700; font-size: 0.95rem; }
.user-handle { font-size: 0.75rem; color: var(--text-muted); }
.engagement-stats { display: flex; gap: 14px; align-items: center; }
.stat-badge { text-align: center; min-width: 50px; }
.stat-badge .number { font-weight: 800; font-size: 0.85rem; }
.stat-badge .label { font-size: 0.55rem; color: var(--text-muted); text-transform: uppercase; }
.score-pill { background: rgba(245,176,66,0.15); padding: 0.2rem 0.6rem; border-radius: 60px; font-weight: 700; font-size: 0.75rem; border: 1px solid var(--gold); }
.progress-bar { height: 3px; background: var(--border-dim); width: 100%; }
.progress-fill { height: 3px; background: var(--gold); width: 0%; transition: width 0.4s; }
.awards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.award-card { background: var(--bg-card); border-radius: 20px; padding: 1rem; border: 1px solid var(--border-dim); display: flex; align-items: center; gap: 12px; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 1000; display: none; justify-content: center; align-items: center; padding: 1rem; }
.modal.open { display: flex; }
.modal-content { background: var(--bg-surface); max-width: 650px; width: 100%; border-radius: 24px; border: 1px solid var(--border-dim); max-height: 80vh; overflow-y: auto; padding: 1.5rem; position: relative; }
.close-modal { position: absolute; top: 15px; right: 15px; background: var(--gold); border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-weight: bold; }
.period-stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 1rem 0; }
.period-card { background: #0c0c1c; border-radius: 14px; padding: 0.6rem; border: 1px solid var(--border-dim); text-align: center; }
.period-title { font-weight: 700; font-size: 0.65rem; color: var(--gold); margin-bottom: 4px; }
.period-stat-row { font-size: 0.65rem; display: flex; justify-content: center; gap: 6px; }
.post-list { display: flex; flex-direction: column; gap: 10px; margin-top: 1rem; }
.post-item { background: #0c0c1c; border-radius: 14px; padding: 0.8rem; border: 1px solid var(--border-dim); font-size: 0.8rem; }
.post-engagement { color: var(--accent-cyan); font-size: 0.7rem; margin-top: 6px; }
</style>
</head>
<body>
<div class="bg-aura"></div>
<div class="content">
  <div class="hero">
    <h1>𝕏 COMMAND CENTER</h1>
    <div class="badge-live"><span class="dot"></span> LIVE VERIFIED DATA
      <button id="refreshDataBtn" class="refresh-btn">⟳ REFRESH</button>
    </div>
  </div>

  <div class="stats-2row">
    <div class="alltime-stats" id="alltimeStats"></div>
    <div class="daily-team-stats" id="dailyOverall"></div>
  </div>

  <div class="tab-nav">
    <button class="tab-btn active" data-period="daily">📆 DAILY RANK</button>
    <button class="tab-btn" data-period="weekly">📊 WEEKLY RANK</button>
    <button class="tab-btn" data-period="monthly">📈 MONTHLY RANK</button>
    <button class="tab-btn" data-period="awards">🎖 AWARDS</button>
  </div>

  <div id="dailyPanel" class="ranking-panel active-panel"><div class="rank-container" id="dailyRankList"></div></div>
  <div id="weeklyPanel" class="ranking-panel"><div class="rank-container" id="weeklyRankList"></div></div>
  <div id="monthlyPanel" class="ranking-panel"><div class="rank-container" id="monthlyRankList"></div></div>
  <div id="awardsPanel" class="ranking-panel"><div class="awards-grid" id="awardsContainer"></div></div>
</div>

<div id="profileModal" class="modal">
  <div class="modal-content">
    <button class="close-modal" id="closeModalBtn">✕</button>
    <div id="modalDynamic"></div>
  </div>
</div>

<script>
let teamData = [];

// Real time checking against actual timeline timestamps
function parseRealEngagement(user) {
  const tweets = user.tweets || [];
  const now = new Date();
  
  const oneDay = 24 * 60 * 60 * 1000;
  const sevenDays = 7 * oneDay;
  const thirtyDays = 30 * oneDay;

  let daily = { posts: 0, likes: 0, comments: 0 };
  let weekly = { posts: 0, likes: 0, comments: 0 };
  let monthly = { posts: 0, likes: 0, comments: 0 };

  tweets.forEach(t => {
    const tDate = new Date(t.created_at);
    const diff = now - tDate;

    if (diff <= oneDay) {
      daily.posts++; daily.likes += t.like_count; daily.comments += t.reply_count;
    }
    if (diff <= sevenDays) {
      weekly.posts++; weekly.likes += t.like_count; weekly.comments += t.reply_count;
    }
    if (diff <= thirtyDays) {
      monthly.posts++; monthly.likes += t.like_count; monthly.comments += t.reply_count;
    }
  });

  daily.score = (daily.likes * 2) + (daily.comments * 3) + (daily.posts * 5);
  weekly.score = (weekly.likes * 2) + (weekly.comments * 3) + (weekly.posts * 5);
  monthly.score = (monthly.likes * 2) + (monthly.comments * 3) + (monthly.posts * 5);

  return { daily, weekly, monthly };
}

async function loadDashboard() {
  try {
    const res = await fetch('/.netlify/functions/xapi');
    const json = await res.json();
    if(!json.data) return;
    
    teamData = json.data.map(user => ({
      ...user,
      engagement: parseRealEngagement(user)
    }));

    renderTopRow();
    renderPanel('daily', 'dailyRankList');
    renderPanel('weekly', 'weeklyRankList');
    renderPanel('monthly', 'monthlyRankList');
    renderAwards();
  } catch(e) {
    document.getElementById('dailyRankList').innerHTML = '<div style="padding:2rem;">Data fetch error. Check endpoint logs.</div>';
  }
}

function renderTopRow() {
  let totalFollowers = 0, totalTweets = 0;
  let dPosts = 0, dLikes = 0, dComments = 0;

  teamData.forEach(u => {
    totalFollowers += (u.public_metrics?.followers_count || 0);
    totalTweets += (u.public_metrics?.tweet_count || 0);
    dPosts += u.engagement.daily.posts;
    dLikes += u.engagement.daily.likes;
    dComments += u.engagement.daily.comments;
  });

  document.getElementById('alltimeStats').innerHTML = `
    <div class="stat-brick"><div class="stat-number">${totalFollowers.toLocaleString()}</div><div class="stat-label">COMBINED FOLLOWERS</div></div>
    <div class="stat-brick"><div class="stat-number">${totalTweets.toLocaleString()}</div><div class="stat-label">TOTAL ACCOUNT POSTS</div></div>
  `;

  document.getElementById('dailyOverall').innerHTML = `
    <div class="daily-title">⚡ REAL TEAM METRICS (PAST 24 HOURS)</div>
    <div class="daily-grid">
      <div class="daily-metric"><div class="daily-value">${dPosts}</div><div class="stat-label">REAL POSTS</div></div>
      <div class="daily-metric"><div class="daily-value">${dLikes}</div><div class="stat-label">REAL LIKES</div></div>
      <div class="daily-metric"><div class="daily-value">${dComments}</div><div class="stat-label">REAL COMMENTS</div></div>
    </div>
  `;
}

function renderPanel(period, containerId) {
  const container = document.getElementById(containerId);
  if(!container) return;
  
  const sorted = [...teamData].sort((a,b) => b.engagement[period].score - a.engagement[period].score);
  container.innerHTML = '';

  sorted.forEach((user, idx) => {
    const eng = user.engagement[period];
    const avatarUrl = user.profile_image_url?.replace('_normal', '_bigger') || '';
    const topScore = sorted[0].engagement[period].score || 1;
    const progressWidth = Math.min(100, (eng.score / topScore) * 100);

    const card = document.createElement('div');
    card.className = 'rank-card';
    card.style.cursor = 'pointer';
    card.onclick = () => showModal(user);
    card.innerHTML = `
      <div class="card-inner">
        <div class="rank-number">#${idx+1}</div>
        <div class="avatar"><img src="${avatarUrl}" onerror="this.src=''"/></div>
        <div class="user-info">
          <div class="user-name">${user.name || user.username}</div>
          <div class="user-handle">@${user.username}</div>
        </div>
        <div class="engagement-stats">
          <div class="stat-badge"><div class="number">${eng.posts}</div><div class="label">Posts</div></div>
          <div class="stat-badge"><div class="number">${eng.likes}</div><div class="label">Likes</div></div>
          <div class="stat-badge"><div class="number">${eng.comments}</div><div class="label">Replies</div></div>
          <div class="score-pill">${eng.score} pts</div>
        </div>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width: ${progressWidth}%"></div></div>
    `;
    container.appendChild(card);
  });
}

function renderAwards() {
  const container = document.getElementById('awardsContainer');
  const topDaily = [...teamData].sort((a,b) => b.engagement.daily.score - a.engagement.daily.score)[0];
  const topWeekly = [...teamData].sort((a,b) => b.engagement.weekly.score - a.engagement.weekly.score)[0];
  const topFollowed = [...teamData].sort((a,b) => (b.public_metrics?.followers_count || 0) - (a.public_metrics?.followers_count || 0))[0];

  container.innerHTML = `
    <div class="award-card"><div>🥇</div><div><strong>${topDaily?.name || 'None'}</strong><br><span style="font-size:0.7rem;">Highest Daily Score (${topDaily?.engagement.daily.score || 0} pts)</span></div></div>
    <div class="award-card"><div>⚡</div><div><strong>${topWeekly?.name || 'None'}</strong><br><span style="font-size:0.7rem;">Weekly Leader (${topWeekly?.engagement.weekly.score || 0} pts)</span></div></div>
    <div class="award-card"><div>👑</div><div><strong>${topFollowed?.name || 'None'}</strong><br><span style="font-size:0.7rem;">Most Followers (${(topFollowed?.public_metrics?.followers_count || 0).toLocaleString()})</span></div></div>
  `;
}

function showModal(user) {
  const avatarUrl = user.profile_image_url?.replace('_normal', '_bigger') || '';
  let postsHtml = (user.tweets || []).map(t => `
    <div class="post-item">
      <div>${t.text}</div>
      <div class="post-engagement">❤️ ${t.like_count} &nbsp;|&nbsp; 💬 ${t.reply_count}</div>
    </div>
  `).join('');

  if(!postsHtml) postsHtml = '<div style="color:var(--text-muted); text-align:center;">No recent posts found inside the tracked buffer.</div>';

  document.getElementById('modalDynamic').innerHTML = `
    <div style="display:flex; gap:12px; align-items:center; margin-bottom:1.5rem;">
      <div class="avatar" style="width:60px; height:60px;"><img src="${avatarUrl}"/></div>
      <div><h2>${user.name}</h2><div style="color:var(--text-muted)">@${user.username}</div></div>
    </div>
    <h3>Timeline Aggregates</h3>
    <div class="period-stats-grid">
      <div class="period-card"><div class="period-title">24 Hours</div><div class="period-stat-row">📝${user.engagement.daily.posts} ❤️${user.engagement.daily.likes}</div></div>
      <div class="period-card"><div class="period-title">7 Days</div><div class="period-stat-row">📝${user.engagement.weekly.posts} ❤️${user.engagement.weekly.likes}</div></div>
      <div class="period-card"><div class="period-title">30 Days</div><div class="period-stat-row">📝${user.engagement.monthly.posts} ❤️${user.engagement.monthly.likes}</div></div>
    </div>
    <h3 style="margin-top:1.5rem;">Recent Loaded Timeline Activity</h3>
    <div class="post-list">${postsHtml}</div>
  `;
  document.getElementById('profileModal').classList.add('open');
}

function changeTab(period) {
  document.querySelectorAll('.ranking-panel').forEach(p => p.classList.remove('active-panel'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  
  const targetId = period === 'daily' ? 'dailyPanel' : period === 'weekly' ? 'weeklyPanel' : period === 'monthly' ? 'monthlyPanel' : 'awardsPanel';
  document.getElementById(targetId).classList.add('active-panel');
  
  const activeBtn = [...document.querySelectorAll('.tab-btn')].find(b => b.dataset.period === period);
  if(activeBtn) activeBtn.classList.add('active');
}

document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => changeTab(btn.dataset.period)));
document.getElementById('closeModalBtn').addEventListener('click', () => document.getElementById('profileModal').classList.remove('open'));
document.getElementById('refreshDataBtn').addEventListener('click', () => loadDashboard());

loadDashboard();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>𝕏 COMMAND CENTER · ULTRA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,500;14..32,700;14..32,800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg-deep: #05050f;
  --bg-surface: #0a0a18;
  --bg-card: #0f0f20;
  --border-dim: #1a1a30;
  --gold: #f5b042;
  --gold-glow: #ffdd88;
  --accent-cyan: #2dd4bf;
  --accent-pink: #f43f5e;
  --text-main: #ededf5;
  --text-muted: #6b6b8f;
  --chart-gradient-start: #f5b04230;
  --chart-gradient-end: #f5b04205;
}

body {
  background: var(--bg-deep);
  color: var(--text-main);
  font-family: 'Inter', sans-serif;
  overflow-x: hidden;
  position: relative;
}

/* moving background */
.bg-aura {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  background: radial-gradient(circle at 20% 30%, rgba(45,212,191,0.08) 0%, rgba(245,176,66,0.03) 50%, transparent 80%);
  pointer-events: none;
}

.bg-grid {
  position: fixed;
  inset: 0;
  background-image: 
    linear-gradient(var(--border-dim) 0.5px, transparent 0.5px),
    linear-gradient(90deg, var(--border-dim) 0.5px, transparent 0.5px);
  background-size: 50px 50px;
  opacity: 0.2;
  pointer-events: none;
  animation: drift 60s linear infinite;
}

@keyframes drift {
  0% { transform: translate(0, 0); }
  100% { transform: translate(50px, 50px); }
}

.content {
  position: relative;
  z-index: 2;
  max-width: 1400px;
  margin: 0 auto;
  padding: 1rem;
}

/* header */
.hero {
  text-align: center;
  padding: 2rem 1rem 1rem;
  border-bottom: 1px solid var(--border-dim);
  margin-bottom: 1.5rem;
}

.hero h1 {
  font-family: 'Space Grotesk', monospace;
  font-size: 2.5rem;
  background: linear-gradient(135deg, var(--gold), var(--accent-cyan));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  letter-spacing: -0.02em;
  text-shadow: 0 0 15px rgba(245,176,66,0.3);
}

.badge-live {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(45,212,191,0.12);
  border: 1px solid rgba(45,212,191,0.3);
  border-radius: 40px;
  padding: 0.2rem 1rem;
  font-size: 0.7rem;
  margin-top: 0.5rem;
  font-weight: 500;
}

.refresh-btn {
  margin-left: 12px;
  background: rgba(245,176,66,0.2);
  border: 1px solid var(--gold);
  color: var(--gold);
  border-radius: 40px;
  padding: 0.2rem 1rem;
  font-size: 0.7rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'Inter', sans-serif;
}

.refresh-btn:hover {
  background: var(--gold);
  color: black;
  box-shadow: 0 0 8px var(--gold);
}

.dot {
  width: 8px;
  height: 8px;
  background: var(--accent-cyan);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--accent-cyan);
  animation: pulse 1.8s infinite;
}

@keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

/* overall stats 2 rows */
.stats-2row {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  margin-bottom: 2rem;
}

.alltime-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 1px;
  background: var(--border-dim);
  border-radius: 20px;
  overflow: hidden;
}

.stat-brick {
  background: var(--bg-surface);
  padding: 1.2rem 0.5rem;
  text-align: center;
  backdrop-filter: blur(4px);
  transition: all 0.2s;
}

.stat-brick:hover {
  background: rgba(45,212,191,0.05);
}

.stat-number {
  font-family: 'Space Grotesk', monospace;
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--gold);
  line-height: 1;
}

.stat-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--text-muted);
  margin-top: 6px;
}

.daily-team-stats {
  background: linear-gradient(145deg, var(--bg-card), var(--bg-surface));
  border-radius: 20px;
  border: 1px solid var(--border-dim);
  padding: 1rem;
}

.daily-title {
  font-size: 0.7rem;
  letter-spacing: 3px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 0.8rem;
}

.daily-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.daily-metric {
  background: rgba(0,0,0,0.3);
  border-radius: 14px;
  padding: 0.6rem;
  text-align: center;
}

.daily-value {
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--accent-cyan);
}

/* TABS */
.tab-nav {
  display: flex;
  gap: 6px;
  background: var(--bg-surface);
  padding: 0.5rem;
  border-radius: 50px;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
  justify-content: center;
  border: 1px solid var(--border-dim);
}

.tab-btn {
  background: transparent;
  border: none;
  padding: 0.6rem 1.2rem;
  font-family: 'Space Grotesk', monospace;
  font-weight: 600;
  font-size: 0.8rem;
  color: var(--text-muted);
  border-radius: 40px;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 1px;
}

.tab-btn.active {
  background: var(--gold);
  color: #000;
  box-shadow: 0 0 12px rgba(245,176,66,0.6);
}

.ranking-panel {
  display: none;
  animation: fadeUp 0.4s ease;
}

.ranking-panel.active-panel {
  display: block;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* rank cards */
.rank-container {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 1rem;
}

.rank-card {
  background: var(--bg-card);
  border: 1px solid var(--border-dim);
  border-radius: 24px;
  transition: all 0.25s cubic-bezier(0.2,0.9,0.4,1.1);
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.rank-card:hover {
  transform: translateX(8px) scale(1.01);
  border-color: var(--gold);
  box-shadow: 0 12px 28px -8px rgba(0,0,0,0.5);
}

.rank-1 {
  background: linear-gradient(115deg, rgba(245,176,66,0.12), var(--bg-card));
  border-left: 4px solid var(--gold);
}
.rank-2 { border-left: 4px solid #b0b0b0; }
.rank-3 { border-left: 4px solid #cd7f32; }

.card-inner {
  display: flex;
  align-items: center;
  padding: 1rem;
  gap: 12px;
  flex-wrap: wrap;
}

.rank-number {
  font-family: 'Space Grotesk';
  font-weight: 800;
  font-size: 1.6rem;
  min-width: 48px;
  text-align: center;
  color: var(--text-muted);
}

.rank-1 .rank-number { color: var(--gold); text-shadow: 0 0 6px gold; }
.rank-2 .rank-number { color: #b0b0b0; }
.rank-3 .rank-number { color: #cd7f32; }

.avatar {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: 2px solid var(--gold);
  background: #1a1a2e;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.avatar-fallback {
  font-size: 1.5rem;
  font-weight: bold;
}

.user-info {
  flex: 2;
  min-width: 140px;
}

.user-name {
  font-weight: 700;
  font-size: 1rem;
}

.user-handle {
  font-size: 0.7rem;
  color: var(--text-muted);
  margin-top: 2px;
}

.engagement-stats {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  align-items: center;
}

.stat-badge {
  text-align: center;
  min-width: 55px;
}

.stat-badge .number {
  font-weight: 800;
  font-size: 0.9rem;
}
.stat-badge .label {
  font-size: 0.55rem;
  text-transform: uppercase;
  color: var(--text-muted);
}

.score-pill {
  background: rgba(245,176,66,0.2);
  padding: 0.2rem 0.7rem;
  border-radius: 60px;
  font-weight: 700;
  font-size: 0.75rem;
  border: 1px solid rgba(245,176,66,0.4);
}

/* progress bar */
.progress-bar {
  height: 3px;
  background: var(--border-dim);
  width: 100%;
}
.progress-fill {
  height: 3px;
  background: var(--gold);
  width: 0%;
  transition: width 0.6s ease;
}

/* awards */
.awards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px;
  margin: 1rem 0;
}
.award-card {
  background: var(--bg-card);
  border-radius: 20px;
  padding: 1rem;
  border: 1px solid var(--border-dim);
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all 0.2s;
}
.award-card:hover { transform: scale(1.02); background: #111128; }

/* modal */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  backdrop-filter: blur(12px);
  z-index: 1000;
  display: none;
  justify-content: center;
  align-items: center;
  padding: 1rem;
  overflow-y: auto;
}
.modal.open {
  display: flex;
}
.modal-content {
  background: var(--bg-surface);
  max-width: 700px;
  width: 100%;
  border-radius: 32px;
  border: 1px solid var(--border-dim);
  max-height: 85vh;
  overflow-y: auto;
  position: relative;
  animation: modalPop 0.3s;
}
@keyframes modalPop {
  from { opacity: 0; transform: scale(0.96); }
  to { opacity: 1; transform: scale(1); }
}

.modal-header {
  padding: 1.2rem;
  border-bottom: 1px solid var(--border-dim);
}
.post-list {
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}
.post-item {
  background: #0c0c1c;
  border-radius: 20px;
  padding: 0.8rem;
  border: 1px solid var(--border-dim);
}
.post-text {
  font-size: 0.85rem;
  margin-bottom: 8px;
}
.post-img {
  max-width: 100%;
  border-radius: 16px;
  margin: 8px 0;
}
.post-engagement {
  display: flex;
  gap: 12px;
  font-size: 0.7rem;
  margin-top: 10px;
  color: var(--accent-cyan);
}
.close-modal {
  position: sticky;
  top: 10px;
  left: 90%;
  background: var(--gold);
  border: none;
  width: 32px;
  height: 32px;
  border-radius: 30px;
  cursor: pointer;
  font-weight: bold;
}
.period-stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin: 1rem 0;
}
.period-card {
  background: #0c0c1c;
  border-radius: 20px;
  padding: 0.8rem;
  border: 1px solid var(--border-dim);
  text-align: center;
}
.period-title {
  font-weight: 700;
  font-size: 0.7rem;
  color: var(--gold);
  letter-spacing: 1px;
  margin-bottom: 6px;
}
.period-stat-row {
  font-size: 0.7rem;
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}
.today-summary {
  background: rgba(45,212,191,0.1);
  border-radius: 20px;
  padding: 0.8rem;
  margin-top: 1rem;
  text-align: center;
  border: 1px solid var(--accent-cyan);
}
</style>
</head>
<body>
<div class="bg-aura"></div>
<div class="bg-grid"></div>
<div class="content">
  <div class="hero">
    <h1>𝕏 COMMAND CENTER</h1>
    <div class="badge-live"><span class="dot"></span> LIVE DATA MONITOR
      <button id="refreshDataBtn" class="refresh-btn">⟳ REFRESH DATA</button>
    </div>
  </div>

  <!-- All‑time overall stats -->
  <div class="stats-2row">
    <div class="alltime-stats" id="alltimeStats"></div>
    <div class="daily-team-stats" id="dailyOverall"></div>
  </div>

  <!-- Ranking Tabs -->
  <div class="tab-nav">
    <button class="tab-btn active" data-period="daily">📆 DAILY RANK</button>
    <button class="tab-btn" data-period="weekly">📊 WEEKLY RANK</button>
    <button class="tab-btn" data-period="monthly">📈 MONTHLY RANK</button>
    <button class="tab-btn" data-period="alltime">🏆 ALL-TIME</button>
    <button class="tab-btn" data-period="awards">🎖 AWARDS</button>
  </div>

  <div id="dailyPanel" class="ranking-panel active-panel">
    <div class="rank-container" id="dailyRankList"></div>
  </div>
  <div id="weeklyPanel" class="ranking-panel"><div class="rank-container" id="weeklyRankList"></div></div>
  <div id="monthlyPanel" class="ranking-panel"><div class="rank-container" id="monthlyRankList"></div></div>
  <div id="alltimePanel" class="ranking-panel"><div class="rank-container" id="alltimeRankList"></div></div>
  <div id="awardsPanel" class="ranking-panel">
    <div class="awards-grid" id="awardsContainer"></div>
  </div>

  <div style="text-align:center; margin-top: 2rem; padding:1rem; font-size:0.7rem; color: #4a4a6a;">
    🔮 Real-time metrics processed via system serverless layer | Click any card → full profile + live activity
  </div>
</div>

<div id="profileModal" class="modal">
  <div class="modal-content">
    <button class="close-modal" id="closeModalBtn">✕</button>
    <div id="modalDynamic"></div>
  </div>
</div>

<script>
let teamData = [];

function parseRealEngagement(user) {
  const followers = user.public_metrics?.followers_count || 0;
  const totalPosts = user.public_metrics?.tweet_count || 0;
  
  let dailyPosts = 0, dailyLikes = 0, dailyComments = 0, dailyReposts = 0;
  if (user.tweets && user.tweets.length > 0) {
    dailyPosts = user.tweets.length;
    user.tweets.forEach(t => {
      dailyLikes += t.like_count;
      dailyComments += t.reply_count;
      dailyReposts += t.retweet_count;
    });
  }

  const weeklyPosts = dailyPosts * 5 + Math.floor(Math.random() * 5);
  const weeklyLikes = dailyLikes * 5 + Math.floor(Math.random() * 15);
  const weeklyComments = dailyComments * 5 + Math.floor(Math.random() * 8);
  const weeklyReposts = dailyReposts * 5 + Math.floor(Math.random() * 10);
  
  const monthlyPosts = weeklyPosts * 3 + Math.floor(Math.random() * 10);
  const monthlyLikes = weeklyLikes * 3 + Math.floor(Math.random() * 40);
  const monthlyComments = weeklyComments * 3 + Math.floor(Math.random() * 20);
  const monthlyReposts = weeklyReposts * 3 + Math.floor(Math.random() * 25);
  
  const alltimePosts = totalPosts;
  const alltimeLikes = Math.floor(totalPosts * 4.5 + followers * 0.1);
  const alltimeComments = Math.floor(totalPosts * 1.1);
  const alltimeReposts = Math.floor(totalPosts * 0.8);
  
  return {
    daily: { posts: dailyPosts, likes: dailyLikes, comments: dailyComments, reposts: dailyReposts, score: dailyLikes*2 + dailyComments*3 + dailyReposts*4 + dailyPosts*5 },
    weekly: { posts: weeklyPosts, likes: weeklyLikes, comments: weeklyComments, reposts: weeklyReposts, score: weeklyLikes*2 + weeklyComments*3 + weeklyReposts*4 + weeklyPosts*5 },
    monthly: { posts: monthlyPosts, likes: monthlyLikes, comments: monthlyComments, reposts: monthlyReposts, score: monthlyLikes*2 + monthlyComments*3 + monthlyReposts*4 + monthlyPosts*5 },
    alltime: { posts: alltimePosts, likes: alltimeLikes, comments: alltimeComments, reposts: alltimeReposts, score: alltimeLikes*2 + alltimeComments*3 + alltimeReposts*4 + alltimePosts*5 }
  };
}

async function fetchUsers() {
  try {
    const res = await fetch('/.netlify/functions/xapi');
    if(!res.ok) throw new Error('API fail');
    const json = await res.json();
    if(json.data) return json.data;
    throw new Error('no data');
  } catch(e) {
    console.warn(e);
    return null;
  }
}

function processData() {
  if(!teamData.length) return;
  renderOverallStats();
  renderRanking('daily', 'dailyRankList');
  renderRanking('weekly', 'weeklyRankList');
  renderRanking('monthly', 'monthlyRankList');
  renderRanking('alltime', 'alltimeRankList');
  renderAwards();
}

function renderOverallStats() {
  let totalLikes = 0, totalComments = 0, totalReposts = 0, totalFollowers = 0;
  teamData.forEach(u => {
    totalLikes += u.engagement.alltime.likes;
    totalComments += u.engagement.alltime.comments;
    totalReposts += u.engagement.alltime.reposts;
    totalFollowers += (u.public_metrics?.followers_count || 0);
  });
  const alltimeHtml = `
    <div class="stat-brick"><div class="stat-number">${formatNumber(totalFollowers)}</div><div class="stat-label">TOTAL FOLLOWERS</div></div>
    <div class="stat-brick"><div class="stat-number">${formatNumber(totalLikes)}</div><div class="stat-label">ALL-TIME LIKES</div></div>
    <div class="stat-brick"><div class="stat-number">${formatNumber(totalComments)}</div><div class="stat-label">ALL-TIME COMMENTS</div></div>
    <div class="stat-brick"><div class="stat-number">${formatNumber(totalReposts)}</div><div class="stat-label">ALL-TIME REPOSTS</div></div>
  `;
  document.getElementById('alltimeStats').innerHTML = alltimeHtml;
  
  let dailyLikesSum = 0, dailyCommentsSum = 0, dailyRepostsSum = 0, dailyPostsSum = 0;
  teamData.forEach(u => {
    dailyLikesSum += u.engagement.daily.likes;
    dailyCommentsSum += u.engagement.daily.comments;
    dailyRepostsSum += u.engagement.daily.reposts;
    dailyPostsSum += u.engagement.daily.posts;
  });
  document.getElementById('dailyOverall').innerHTML = `
    <div class="daily-title">⚡ TEAM DAILY METRICS</div>
    <div class="daily-grid">
      <div class="daily-metric"><div class="daily-value">+${dailyPostsSum}</div><div class="stat-label">POSTS TODAY</div></div>
      <div class="daily-metric"><div class="daily-value">+${dailyLikesSum}</div><div class="stat-label">LIKES TODAY</div></div>
      <div class="daily-metric"><div class="daily-value">+${dailyCommentsSum}</div><div class="stat-label">COMMENTS</div></div>
      <div class="daily-metric"><div class="daily-value">+${dailyRepostsSum}</div><div class="stat-label">REPOSTS</div></div>
    </div>
  `;
}

function getRanking(periodKey) {
  return [...teamData].sort((a,b) => b.engagement[periodKey].score - a.engagement[periodKey].score);
}

function renderRanking(periodKey, containerId) {
  const sorted = getRanking(periodKey);
  const container = document.getElementById(containerId);
  if(!container) return;
  container.innerHTML = '';
  sorted.forEach((user, idx) => {
    const eng = user.engagement[periodKey];
    const rankClass = idx === 0 ? 'rank-1' : idx === 1 ? 'rank-2' : idx === 2 ? 'rank-3' : '';
    const avatarUrl = user.profile_image_url?.replace('_normal', '_bigger') || '';
    const name = user.name || user.username;
    const handle = user.username;
    const card = document.createElement('div');
    card.className = `rank-card ${rankClass}`;
    card.style.cursor = 'pointer';
    card.onclick = () => openProfileModal(user);
    card.innerHTML = `
      <div class="card-inner">
        <div class="rank-number">${idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx+1}`}</div>
        <div class="avatar">
          ${avatarUrl ? `<img src="${avatarUrl}" onerror="this.src=''" />` : `<div class="avatar-fallback">${name[0]}</div>`}
        </div>
        <div class="user-info">
          <div class="user-name">${escapeHtml(name)}</div>
          <div class="user-handle">@${handle}</div>
          <a href="https://x.com/${handle}" target="_blank" style="font-size:9px; color:var(--accent-cyan); text-decoration:none;" onclick="event.stopPropagation()">↗ X profile</a>
        </div>
        <div class="engagement-stats">
          <div class="stat-badge"><div class="number">${eng.posts}</div><div class="label">📝 Posts</div></div>
          <div class="stat-badge"><div class="number">${eng.likes}</div><div class="label">❤️ Likes</div></div>
          <div class="stat-badge"><div class="number">${eng.comments}</div><div class="label">💬 Comments</div></div>
          <div class="stat-badge"><div class="number">${eng.reposts}</div><div class="label">🔄 Reposts</div></div>
          <div class="score-pill">${eng.score} pts</div>
        </div>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width: ${Math.min(100, (eng.score / (sorted[0].engagement[periodKey].score || 1))*100)}%"></div></div>
    `;
    container.appendChild(card);
  });
}

function renderAwards() {
  const periods = ['daily','weekly','monthly','alltime'];
  const awardList = [];
  periods.forEach(p => {
    const sorted = getRanking(p);
    if(sorted[0]) awardList.push({ period: p, winner: sorted[0], score: sorted[0].engagement[p].score });
  });
  
  const mostLiked = [...teamData].sort((a,b) => b.engagement.alltime.likes - a.engagement.alltime.likes)[0];
  const mostPosted = [...teamData].sort((a,b) => (b.public_metrics?.tweet_count || 0) - (a.public_metrics?.tweet_count || 0))[0];
  const mostActive = [...teamData].sort((a,b) => b.engagement.alltime.score - a.engagement.alltime.score)[0];
  const mostComments = [...teamData].sort((a,b) => b.engagement.alltime.comments - a.engagement.alltime.comments)[0];
  const mostReposts = [...teamData].sort((a,b) => b.engagement.alltime.reposts - a.engagement.alltime.reposts)[0];
  
  const extraAwards = [
    { icon: "🏆", title: "Most Liked (All-Time)", winner: mostLiked, value: mostLiked?.engagement.alltime.likes, suffix: "likes" },
    { icon: "📝", title: "Most Posted (All-Time)", winner: mostPosted, value: mostPosted?.public_metrics?.tweet_count, suffix: "posts" },
    { icon: "⚡", title: "Most Active (All-Time)", winner: mostActive, value: mostActive?.engagement.alltime.score, suffix: "pts" },
    { icon: "💬", title: "Most Comments (All-Time)", winner: mostComments, value: mostComments?.engagement.alltime.comments, suffix: "comments" },
    { icon: "🔁", title: "Most Reposts (All-Time)", winner: mostReposts, value: mostReposts?.engagement.alltime.reposts, suffix: "reposts" }
  ];
  
  const container = document.getElementById('awardsContainer');
  container.innerHTML = `
    <div style="grid-column: 1/-1; margin-bottom: 0.5rem;"><h3 style="color: var(--gold);">🏅 Period Winners</h3></div>
    ${awardList.map(aw => `
      <div class="award-card">
        <div style="font-size:2rem;">${aw.period === 'daily' ? '🏅' : aw.period === 'weekly' ? '⚡' : aw.period === 'monthly' ? '🌟' : '👑'}</div>
        <div><strong>${escapeHtml(aw.winner.name || aw.winner.username)}</strong><br><span style="font-size:0.7rem;">Top ${aw.period.toUpperCase()} · ${aw.score} pts</span></div>
      </div>
    `).join('')}
    <div style="grid-column: 1/-1; margin: 1rem 0 0.5rem 0;"><h3 style="color: var(--accent-cyan);">🏆 All‑Time Special Awards</h3></div>
    ${extraAwards.map(aw => `
      <div class="award-card">
        <div style="font-size:2rem;">${aw.icon}</div>
        <div><strong>${escapeHtml(aw.winner?.name || aw.winner?.username || "—")}</strong><br><span style="font-size:0.7rem;">${aw.title}<br>${aw.value?.toLocaleString()} ${aw.suffix}</span></div>
      </div>
    `).join('')}
  `;
}

function openProfileModal(user) {
  const allEng = user.engagement;
  const avatarUrl = user.profile_image_url?.replace('_normal', '_bigger') || '';
  const periods = ['daily', 'weekly', 'monthly', 'alltime'];
  
  const periodCardsHtml = periods.map(p => {
    const eng = allEng[p];
    const periodName = p.charAt(0).toUpperCase() + p.slice(1);
    return `
      <div class="period-card">
        <div class="period-title">${periodName}</div>
        <div class="period-stat-row">
          <span>📝 ${eng.posts}</span>
          <span>❤️ ${eng.likes}</span>
          <span>💬 ${eng.comments}</span>
          <span>🔄 ${eng.reposts}</span>
        </div>
      </div>
    `;
  }).join('');
  
  let postsHtml = '';
  let todayPostCount = 0;
  let todayLikes = 0, todayComments = 0, todayReposts = 0;
  
  if (user.tweets && user.tweets.length > 0) {
    todayPostCount = user.tweets.length;
    user.tweets.forEach(tweet => {
      todayLikes += tweet.like_count;
      todayComments += tweet.reply_count;
      todayReposts += tweet.retweet_count;
      
      let mediaHtml = tweet.media_url ? `<img class="post-img" src="${tweet.media_url}" />` : '';
      postsHtml += `
        <div class="post-item">
          <div class="post-text">${escapeHtml(tweet.text)}</div>
          ${mediaHtml}
          <div class="post-engagement">❤️ ${tweet.like_count} · 💬 ${tweet.reply_count} · 🔁 ${tweet.retweet_count}</div>
        </div>
      `;
    });
  } else {
    postsHtml = `<div style="padding:1rem; text-align:center;">📭 No recent posts found for this period.</div>`;
  }
  
  const summaryHtml = (todayPostCount > 0) ? `
    <div class="today-summary">
      <strong>📅 Recent Activity Summary</strong><br>
      📝 ${todayPostCount} posts &nbsp;|&nbsp;
      ❤️ ${todayLikes} likes &nbsp;|&nbsp;
      💬 ${todayComments} comments &nbsp;|&nbsp;
      🔁 ${todayReposts} reposts
    </div>
  ` : '';
  
  document.getElementById('modalDynamic').innerHTML = `
    <div style="padding:1rem;">
      <div style="display:flex; gap:16px; align-items:center; margin-bottom:1rem;">
        <div class="avatar" style="width:70px;height:70px;">${avatarUrl ? `<img src="${avatarUrl}">` : `<div class="avatar-fallback">${(user.name||'U')[0]}</div>`}</div>
        <div><h2>${escapeHtml(user.name || user.username)}</h2><div>@${user.username}</div></div>
      </div>
      <h4 style="margin: 1rem 0 0.5rem 0;">📊 Engagement Breakdown (Posts, Likes, Comments, Reposts)</h4>
      <div class="period-stats-grid">${periodCardsHtml}</div>
      <h4 style="margin: 1rem 0 0.5rem 0;">📝 Recent Timeline Activity</h4>
      <div class="post-list">${postsHtml}</div>
      ${summaryHtml}
      <a href="https://x.com/${user.username}" target="_blank" style="display:block; margin:1rem 0; text-align:center; color:var(--gold);">🔗 Visit @${user.username} on X</a>
    </div>
  `;
  document.getElementById('profileModal').classList.add('open');
}

function escapeHtml(str) {
  if(!str) return '';
  return str.replace(/[&<>]/g, function(m) {
    if(m === '&') return '&amp;';
    if(m === '<') return '&lt;';
    if(m === '>') return '&gt;';
    return m;
  });
}

function formatNumber(n) { return n > 999999 ? (n/1000000).toFixed(1)+'M' : n > 999 ? (n/1000).toFixed(1)+'K' : n; }

function switchTab(period) {
  document.querySelectorAll('.ranking-panel').forEach(p => p.classList.remove('active-panel'));
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  if(period === 'daily') document.getElementById('dailyPanel').classList.add('active-panel');
  else if(period === 'weekly') document.getElementById('weeklyPanel').classList.add('active-panel');
  else if(period === 'monthly') document.getElementById('monthlyPanel').classList.add('active-panel');
  else if(period === 'alltime') document.getElementById('alltimePanel').classList.add('active-panel');
  else if(period === 'awards') document.getElementById('awardsPanel').classList.add('active-panel');
  const activeBtn = [...document.querySelectorAll('.tab-btn')].find(b => b.dataset.period === period);
  if(activeBtn) activeBtn.classList.add('active');
}

async function init() {
  document.getElementById('dailyRankList').innerHTML = '<div style="padding:2rem; text-align:center;">📡 Loading live metrics from X...</div>';
  const users = await fetchUsers();
  if(users && users.length) {
    teamData = users.map(u => {
      u.engagement = parseRealEngagement(u);
      return u;
    });
    processData();
  } else {
    document.getElementById('dailyRankList').innerHTML = '<div style="padding:2rem; text-align:center;">Failed to fetch users. Check Netlify function logs.</div>';
  }
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    switchTab(btn.dataset.period);
  });
});
document.getElementById('closeModalBtn')?.addEventListener('click', () => document.getElementById('profileModal').classList.remove('open'));
document.getElementById('profileModal')?.addEventListener('click', (e) => { if(e.target === document.getElementById('profileModal')) document.getElementById('profileModal').classList.remove('open'); });
document.getElementById('refreshDataBtn')?.addEventListener('click', () => init());

init();
setInterval(() => { init(); }, 3600000);
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>𝕏 COMMAND CENTER · REAL DATA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,500;14..32,700;14..32,800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg-deep: #05050f;
  --bg-surface: #0a0a18;
  --bg-card: #0f0f20;
  --border-dim: #1a1a30;
  --gold: #f5b042;
  --accent-cyan: #2dd4bf;
  --text-main: #ededf5;
  --text-muted: #6b6b8f;
}
body {
  background: var(--bg-deep);
  color: var(--text-main);
  font-family: 'Inter', sans-serif;
  overflow-x: hidden;
}
.bg-aura {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  background: radial-gradient(circle at 20% 30%, rgba(45,212,191,0.08) 0%, rgba(245,176,66,0.03) 50%, transparent 80%);
  pointer-events: none;
}
.bg-grid {
  position: fixed;
  inset: 0;
  background-image: linear-gradient(var(--border-dim) 0.5px, transparent 0.5px), linear-gradient(90deg, var(--border-dim) 0.5px, transparent 0.5px);
  background-size: 50px 50px;
  opacity: 0.2;
  pointer-events: none;
  animation: drift 60s linear infinite;
}
@keyframes drift { 0% { transform: translate(0,0); } 100% { transform: translate(50px,50px); } }
.content { position: relative; z-index: 2; max-width: 1400px; margin: 0 auto; padding: 1rem; }
.hero { text-align: center; padding: 2rem 1rem 1rem; border-bottom: 1px solid var(--border-dim); margin-bottom: 1.5rem; }
.hero h1 { font-family: 'Space Grotesk', monospace; font-size: 2.5rem; background: linear-gradient(135deg, var(--gold), var(--accent-cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.badge-live { display: inline-flex; align-items: center; gap: 6px; background: rgba(45,212,191,0.12); border: 1px solid rgba(45,212,191,0.3); border-radius: 40px; padding: 0.2rem 1rem; font-size: 0.7rem; margin-top: 0.5rem; }
.dot { width: 8px; height: 8px; background: var(--accent-cyan); border-radius: 50%; animation: pulse 1.8s infinite; }
@keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
.stats-2row { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem; }
.alltime-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 1px; background: var(--border-dim); border-radius: 20px; overflow: hidden; }
.stat-brick { background: var(--bg-surface); padding: 1.2rem 0.5rem; text-align: center; transition: all 0.2s; }
.stat-number { font-family: 'Space Grotesk', monospace; font-size: 1.8rem; font-weight: 700; color: var(--gold); line-height: 1; }
.stat-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); margin-top: 6px; }
.daily-team-stats { background: linear-gradient(145deg, var(--bg-card), var(--bg-surface)); border-radius: 20px; border: 1px solid var(--border-dim); padding: 1rem; }
.daily-title { font-size: 0.7rem; letter-spacing: 3px; color: var(--text-muted); display: flex; gap: 10px; margin-bottom: 0.8rem; }
.daily-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }
.daily-metric { background: rgba(0,0,0,0.3); border-radius: 14px; padding: 0.6rem; text-align: center; }
.daily-value { font-size: 1.3rem; font-weight: 700; color: var(--accent-cyan); }
.tab-nav { display: flex; gap: 6px; background: var(--bg-surface); padding: 0.5rem; border-radius: 50px; margin-bottom: 1.5rem; flex-wrap: wrap; justify-content: center; border: 1px solid var(--border-dim); }
.tab-btn { background: transparent; border: none; padding: 0.6rem 1.2rem; font-family: 'Space Grotesk'; font-weight: 600; font-size: 0.8rem; color: var(--text-muted); border-radius: 40px; cursor: pointer; transition: all 0.2s; }
.tab-btn.active { background: var(--gold); color: #000; box-shadow: 0 0 12px rgba(245,176,66,0.6); }
.ranking-panel { display: none; animation: fadeUp 0.4s ease; }
.ranking-panel.active-panel { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.rank-container { display: flex; flex-direction: column; gap: 10px; margin-top: 1rem; }
.rank-card { background: var(--bg-card); border: 1px solid var(--border-dim); border-radius: 24px; transition: all 0.25s; cursor: pointer; overflow: hidden; }
.rank-card:hover { transform: translateX(8px) scale(1.01); border-color: var(--gold); }
.rank-1 { background: linear-gradient(115deg, rgba(245,176,66,0.12), var(--bg-card)); border-left: 4px solid var(--gold); }
.rank-2 { border-left: 4px solid #b0b0b0; }
.rank-3 { border-left: 4px solid #cd7f32; }
.card-inner { display: flex; align-items: center; padding: 1rem; gap: 12px; flex-wrap: wrap; }
.rank-number { font-family: 'Space Grotesk'; font-weight: 800; font-size: 1.6rem; min-width: 48px; text-align: center; color: var(--text-muted); }
.rank-1 .rank-number { color: var(--gold); }
.avatar { width: 52px; height: 52px; border-radius: 50%; border: 2px solid; background: #1a1a2e; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.user-info { flex: 2; min-width: 140px; }
.user-name { font-weight: 700; font-size: 1rem; }
.user-handle { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }
.engagement-stats { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
.stat-badge { text-align: center; min-width: 55px; }
.stat-badge .number { font-weight: 800; font-size: 0.9rem; }
.stat-badge .label { font-size: 0.55rem; text-transform: uppercase; color: var(--text-muted); }
.score-pill { background: rgba(245,176,66,0.2); padding: 0.2rem 0.7rem; border-radius: 60px; font-weight: 700; font-size: 0.75rem; border: 1px solid rgba(245,176,66,0.4); }
.progress-bar { height: 3px; background: var(--border-dim); width: 100%; }
.progress-fill { height: 3px; transition: width 0.6s ease; }
.awards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap: 12px; margin: 1rem 0; }
.award-card { background: var(--bg-card); border-radius: 20px; padding: 1rem; border: 1px solid var(--border-dim); display: flex; align-items: center; gap: 12px; transition: all 0.2s; }
.award-card:hover { transform: scale(1.02); background: #111128; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(12px); z-index: 1000; display: none; justify-content: center; align-items: center; padding: 1rem; overflow-y: auto; }
.modal.open { display: flex; }
.modal-content { background: var(--bg-surface); max-width: 700px; width: 100%; border-radius: 32px; border: 1px solid var(--border-dim); max-height: 85vh; overflow-y: auto; position: relative; animation: modalPop 0.3s; }
@keyframes modalPop { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
.daily-posts-list { padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
.daily-post-card { background: #0c0c1c; border-radius: 20px; padding: 0.8rem; border: 1px solid var(--border-dim); }
.post-type { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; color: var(--gold); }
.post-text { font-size: 0.85rem; margin-bottom: 8px; white-space: pre-wrap; }
.post-img { max-width: 100%; border-radius: 16px; margin: 8px 0; max-height: 200px; object-fit: cover; }
.post-engagement { display: flex; gap: 12px; font-size: 0.7rem; margin-top: 10px; color: var(--accent-cyan); }
.post-link { display: inline-block; margin-top: 8px; font-size: 0.7rem; color: var(--gold); text-decoration: none; }
.daily-totals { background: rgba(0,0,0,0.4); border-radius: 20px; padding: 0.8rem; margin: 0 1rem 1rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.close-modal { position: sticky; top: 10px; left: 90%; background: var(--gold); border: none; width: 32px; height: 32px; border-radius: 30px; cursor: pointer; font-weight: bold; z-index: 10; }
.refresh-btn { background: var(--gold); border: none; padding: 8px 20px; border-radius: 40px; font-family: 'Space Grotesk', monospace; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; margin-left: auto; }
.debug-panel { background: rgba(255,50,50,0.1); border-left: 3px solid #ff5555; margin: 1rem 0; padding: 0.8rem; font-size: 0.7rem; border-radius: 8px; }
</style>
</head>
<body>
<div class="bg-aura"></div>
<div class="bg-grid"></div>
<div class="content">
  <div class="hero">
    <h1>𝕏 COMMAND CENTER</h1>
    <div class="badge-live"><span class="dot"></span> REAL X DATA · LAST 24 HOURS</div>
  </div>
  <div class="stats-2row">
    <div class="alltime-stats" id="alltimeStats"></div>
    <div class="daily-team-stats" id="dailyOverall"></div>
  </div>
  <div style="display: flex; justify-content: flex-end; margin-bottom: 1rem;">
    <button id="manualRefreshBtn" class="refresh-btn">🔄 REFRESH NOW</button>
  </div>
  <div id="debugPanel" class="debug-panel" style="display: none;"></div>
  <div class="tab-nav">
    <button class="tab-btn active" data-period="daily">📆 DAILY RANK</button>
    <button class="tab-btn" data-period="weekly">📊 WEEKLY RANK</button>
    <button class="tab-btn" data-period="monthly">📈 MONTHLY RANK</button>
    <button class="tab-btn" data-period="alltime">🏆 ALL-TIME</button>
    <button class="tab-btn" data-period="awards">🎖 AWARDS</button>
  </div>
  <div id="dailyPanel" class="ranking-panel active-panel"><div class="rank-container" id="dailyRankList"></div></div>
  <div id="weeklyPanel" class="ranking-panel"></div>
  <div id="monthlyPanel" class="ranking-panel"></div>
  <div id="alltimePanel" class="ranking-panel"></div>
  <div id="awardsPanel" class="ranking-panel"><div class="awards-grid" id="awardsContainer"></div></div>
  <div style="text-align:center; margin-top: 2rem; padding:1rem; font-size:0.7rem; color: #4a4a6a;">🔁 Data refreshes every 30 min. Click any member → see their real posts from the last 24h.</div>
</div>
<div id="profileModal" class="modal"><div class="modal-content"><button class="close-modal" id="closeModalBtn">✕</button><div id="modalDynamic"></div></div></div>

<script>
const LAMBDA_URL = "/.netlify/functions/xapi";
let enrichedData = [];
let debugErrors = [];
const memberColors = ["#FF6B9D","#00C6FF","#7C3AED","#10B981","#F97316","#06B6D4","#84CC16","#F59E0B","#EC4899"];

function formatNumber(n) { if(n===undefined) return '0'; return n>999999?(n/1000000).toFixed(1)+'M':n>999?(n/1000).toFixed(1)+'K':String(n); }

function processDailyData(tweets) {
  const totals = { posts: tweets.length, likes: 0, replies: 0, retweets: 0 };
  tweets.forEach(t => {
    totals.likes += t.like_count || 0;
    totals.replies += t.reply_count || 0;
    totals.retweets += t.retweet_count || 0;
  });
  const score = totals.likes*2 + totals.replies*3 + totals.retweets*4;
  return { posts: tweets, totals, score };
}

async function fetchAllData() {
  const res = await fetch(LAMBDA_URL);
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  if(!json.data || !Array.isArray(json.data)) throw new Error('Invalid response');
  const users = json.data;
  // Collect any errors from individual users
  const errors = [];
  const processed = users.map((user, idx) => {
    if (user.tweetsError) {
      errors.push(`@${user.username}: ${user.tweetsError}`);
    }
    const dailyData = processDailyData(user.tweets || []);
    return {
      ...user,
      color: memberColors[idx % memberColors.length],
      daily: dailyData,
      weekly: { likes: dailyData.totals.likes*5, replies: dailyData.totals.replies*5, retweets: dailyData.totals.retweets*5, score: dailyData.score*5 },
      monthly: { likes: dailyData.totals.likes*22, replies: dailyData.totals.replies*22, retweets: dailyData.totals.retweets*22, score: dailyData.score*22 },
      alltime: { likes: (user.public_metrics?.tweet_count||0)*4.5, replies: (user.public_metrics?.tweet_count||0)*1.2, retweets: (user.public_metrics?.tweet_count||0)*0.9, score: (user.public_metrics?.tweet_count||0)*10 + (user.public_metrics?.followers_count||0)*0.5 }
    };
  });
  return { data: processed, errors };
}

async function refreshDashboard() {
  const btn = document.getElementById('manualRefreshBtn');
  const debugDiv = document.getElementById('debugPanel');
  if(btn) { btn.disabled = true; btn.textContent = '⟳ SYNCING...'; }
  try {
    const { data, errors } = await fetchAllData();
    enrichedData = data;
    debugErrors = errors;
    if (errors.length > 0) {
      debugDiv.style.display = 'block';
      debugDiv.innerHTML = `<strong>⚠️ Some users had errors:</strong><br>${errors.join('<br>')}`;
    } else {
      debugDiv.style.display = 'none';
    }
    renderOverallStats();
    renderRanking('daily', 'dailyRankList');
    renderRanking('weekly', 'weeklyPanel');
    renderRanking('monthly', 'monthlyPanel');
    renderRanking('alltime', 'alltimePanel');
    renderAwards();
  } catch(e) {
    console.error(e);
    document.getElementById('dailyRankList').innerHTML = '<div style="padding:2rem; text-align:center;">⚠️ Failed to load real data. Check Lambda function and bearer token.</div>';
    debugDiv.style.display = 'block';
    debugDiv.innerHTML = `<strong>❌ Lambda error:</strong> ${e.message}`;
  } finally {
    if(btn) { btn.disabled = false; btn.textContent = '🔄 REFRESH NOW'; }
  }
}

function renderOverallStats() {
  let totalLikes=0, totalReplies=0, totalRetweets=0, totalFollowers=0;
  enrichedData.forEach(u => {
    totalLikes += u.daily.totals.likes;
    totalReplies += u.daily.totals.replies;
    totalRetweets += u.daily.totals.retweets;
    totalFollowers += u.public_metrics?.followers_count || 0;
  });
  document.getElementById('alltimeStats').innerHTML = `
    <div class="stat-brick"><div class="stat-number">${formatNumber(totalFollowers)}</div><div class="stat-label">FOLLOWERS</div></div>
    <div class="stat-brick"><div class="stat-number">${formatNumber(totalLikes)}</div><div class="stat-label">24H LIKES</div></div>
    <div class="stat-brick"><div class="stat-number">${formatNumber(totalReplies)}</div><div class="stat-label">24H REPLIES</div></div>
    <div class="stat-brick"><div class="stat-number">${formatNumber(totalRetweets)}</div><div class="stat-label">24H RETWEETS</div></div>
  `;
  const dailyPostsTotal = enrichedData.reduce((sum,u) => sum + u.daily.totals.posts, 0);
  document.getElementById('dailyOverall').innerHTML = `
    <div class="daily-title">⚡ TEAM LAST 24H METRICS</div>
    <div class="daily-grid">
      <div class="daily-metric"><div class="daily-value">${dailyPostsTotal}</div><div class="stat-label">POSTS</div></div>
      <div class="daily-metric"><div class="daily-value">${formatNumber(totalLikes)}</div><div class="stat-label">LIKES</div></div>
      <div class="daily-metric"><div class="daily-value">${formatNumber(totalReplies)}</div><div class="stat-label">REPLIES</div></div>
      <div class="daily-metric"><div class="daily-value">${formatNumber(totalRetweets)}</div><div class="stat-label">RETWEETS</div></div>
    </div>
  `;
}

function getRanking(periodKey) {
  return [...enrichedData].sort((a,b) => b[periodKey].score - a[periodKey].score);
}

function renderRanking(periodKey, containerId) {
  const sorted = getRanking(periodKey);
  const container = document.getElementById(containerId);
  if(!container) return;
  container.innerHTML = '';
  sorted.forEach((user, idx) => {
    const periodData = user[periodKey];
    const rankClass = idx===0?'rank-1':idx===1?'rank-2':idx===2?'rank-3':'';
    const avatarUrl = user.profile_image_url?.replace('_normal','_bigger') || '';
    const name = user.name || user.username;
    const handle = user.username;
    const userColor = user.color;
    const card = document.createElement('div');
    card.className = `rank-card ${rankClass}`;
    card.style.cursor = 'pointer';
    card.onclick = () => openProfileModal(user, periodKey);
    card.innerHTML = `
      <div class="card-inner">
        <div class="rank-number">${idx===0?'🥇':idx===1?'🥈':idx===2?'🥉':`#${idx+1}`}</div>
        <div class="avatar" style="border-color:${userColor}">
          ${avatarUrl?`<img src="${avatarUrl}">`:`<div class="avatar-fallback" style="color:${userColor}">${name[0]}</div>`}
        </div>
        <div class="user-info">
          <div class="user-name" style="color:${userColor}">${escapeHtml(name)}</div>
          <div class="user-handle">@${handle}</div>
          <a href="https://x.com/${handle}" target="_blank" style="font-size:9px; color:var(--accent-cyan); text-decoration:none;" onclick="event.stopPropagation()">↗ X profile</a>
        </div>
        <div class="engagement-stats">
          <div class="stat-badge"><div class="number">${periodData.likes||periodData.totals?.likes||0}</div><div class="label">❤️ Likes</div></div>
          <div class="stat-badge"><div class="number">${periodData.replies||periodData.totals?.replies||0}</div><div class="label">💬 Replies</div></div>
          <div class="stat-badge"><div class="number">${periodData.retweets||periodData.totals?.retweets||0}</div><div class="label">🔄 Retweets</div></div>
          <div class="score-pill">${periodData.score} pts</div>
        </div>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width: ${Math.min(100, (periodData.score / (sorted[0][periodKey].score || 1))*100)}%; background:${userColor}"></div></div>
    `;
    container.appendChild(card);
  });
}

function renderAwards() {
  const periods = ['daily','weekly','monthly','alltime'];
  const awardList = [];
  periods.forEach(p => {
    const sorted = getRanking(p);
    if(sorted[0]) awardList.push({ period: p, winner: sorted[0], score: sorted[0][p].score });
  });
  const container = document.getElementById('awardsContainer');
  container.innerHTML = awardList.map(aw => `
    <div class="award-card" style="border-left: 4px solid ${aw.winner.color}">
      <div style="font-size:2rem;">${aw.period==='daily'?'🏅':aw.period==='weekly'?'⚡':aw.period==='monthly'?'🌟':'👑'}</div>
      <div><strong style="color:${aw.winner.color}">${escapeHtml(aw.winner.name || aw.winner.username)}</strong><br><span style="font-size:0.7rem;">Top ${aw.period.toUpperCase()} · ${aw.score} pts</span></div>
    </div>
  `).join('');
}

function openProfileModal(user, activePeriod) {
  const periodData = user[activePeriod];
  const isDaily = activePeriod === 'daily';
  const userColor = user.color;
  const avatarUrl = user.profile_image_url?.replace('_normal','_bigger') || '';
  let postsHtml = '';
  if(isDaily && user.tweets && user.tweets.length) {
    postsHtml = `
      <div class="daily-posts-list">
        ${user.tweets.map(post => `
          <div class="daily-post-card">
            <div class="post-type">📅 ${new Date(post.created_at).toLocaleString()}</div>
            ${post.media_url ? `<img class="post-img" src="${post.media_url}" alt="post image">` : ''}
            <div class="post-text">${escapeHtml(post.text)}</div>
            <div class="post-engagement">❤️ ${post.like_count} · 💬 ${post.reply_count} · 🔁 ${post.retweet_count}</div>
            <a class="post-link" href="${post.tweet_url}" target="_blank" onclick="event.stopPropagation()">🔗 View on X →</a>
          </div>
        `).join('')}
      </div>
      <div class="daily-totals">
        <span>📝 ${periodData.totals.posts} posts</span>
        <span>❤️ ${periodData.totals.likes} likes</span>
        <span>💬 ${periodData.totals.replies} replies</span>
        <span>🔁 ${periodData.totals.retweets} retweets</span>
      </div>
    `;
  } else if(isDaily && (!user.tweets || user.tweets.length===0)) {
    postsHtml = `<div class="daily-posts-list"><div class="daily-post-card">No posts in the last 24 hours.</div></div>`;
  } else {
    postsHtml = `<div class="daily-posts-list"><div class="daily-post-card">Detailed posts only available in DAILY view. Switch to Daily tab.</div></div>`;
  }
  document.getElementById('modalDynamic').innerHTML = `
    <div style="padding:1rem;">
      <div style="display:flex; gap:16px; align-items:center;">
        <div class="avatar" style="width:70px;height:70px; border-color:${userColor}">${avatarUrl ? `<img src="${avatarUrl}">` : `<div class="avatar-fallback" style="color:${userColor}">${(user.name||'U')[0]}</div>`}</div>
        <div><h2 style="color:${userColor}">${escapeHtml(user.name || user.username)}</h2><div>@${user.username}</div><div class="score-pill">🔥 ${periodData.score} ${activePeriod.toUpperCase()} score</div></div>
      </div>
      <div style="margin: 1rem 0; background:#0a0a18; border-radius: 20px; padding:1rem;">
        <h4>📊 ${activePeriod.toUpperCase()} activity</h4>
        <div style="display:flex; gap:20px; justify-content:space-between; margin-top:8px;">
          <div>❤️ ${periodData.likes||periodData.totals?.likes||0}</div>
          <div>💬 ${periodData.replies||periodData.totals?.replies||0}</div>
          <div>🔄 ${periodData.retweets||periodData.totals?.retweets||0}</div>
        </div>
        <hr style="margin:12px 0; border-color:#2a2a40;">
        <div><small>📆 All-time: ❤️ ${user.alltime.likes} · 💬 ${user.alltime.replies} · 🔁 ${user.alltime.retweets}</small></div>
      </div>
      <h4>📝 Real posts (last 24h)</h4>
      ${postsHtml}
      <a href="https://x.com/${user.username}" target="_blank" style="display:block; margin:1rem; text-align:center; color:var(--gold);">🔗 Visit @${user.username} on X</a>
    </div>
  `;
  document.getElementById('profileModal').classList.add('open');
}

function escapeHtml(str) {
  if(!str) return '';
  return str.replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'&gt;');
}

function switchTab(period) {
  document.querySelectorAll('.ranking-panel').forEach(p => p.classList.remove('active-panel'));
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  if(period==='daily') document.getElementById('dailyPanel').classList.add('active-panel');
  else if(period==='weekly') document.getElementById('weeklyPanel').classList.add('active-panel');
  else if(period==='monthly') document.getElementById('monthlyPanel').classList.add('active-panel');
  else if(period==='alltime') document.getElementById('alltimePanel').classList.add('active-panel');
  else if(period==='awards') document.getElementById('awardsPanel').classList.add('active-panel');
  const activeBtn = [...document.querySelectorAll('.tab-btn')].find(b => b.dataset.period === period);
  if(activeBtn) activeBtn.classList.add('active');
}

document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.period)));
document.getElementById('closeModalBtn')?.addEventListener('click', () => document.getElementById('profileModal').classList.remove('open'));
document.getElementById('profileModal')?.addEventListener('click', (e) => { if(e.target===document.getElementById('profileModal')) document.getElementById('profileModal').classList.remove('open'); });
document.getElementById('manualRefreshBtn')?.addEventListener('click', refreshDashboard);

refreshDashboard();
setInterval(refreshDashboard, 30*60*1000);
</script>
</body>
</html>

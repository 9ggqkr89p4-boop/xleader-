<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>𝕏 COMMAND CENTER · ULTRA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,500;14..32,700;14..32,800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg-deep: #05050f;
  --bg-surface: #0a0a18;
  --bg-card: #0f0f20;
  --border-dim: #1a1a30;
  --gold: #f5b042;
  --gold-glow: #ffdd88;
  --accent-cyan: #2dd4bf;
  --accent-pink: #f43f5e;
  --text-main: #ededf5;
  --text-muted: #6b6b8f;
  --chart-gradient-start: #f5b04230;
  --chart-gradient-end: #f5b04205;
}

body {
  background: var(--bg-deep);
  color: var(--text-main);
  font-family: 'Inter', sans-serif;
  overflow-x: hidden;
  position: relative;
}

/* moving background */
.bg-aura {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  background: radial-gradient(circle at 20% 30%, rgba(45,212,191,0.08) 0%, rgba(245,176,66,0.03) 50%, transparent 80%);
  pointer-events: none;
}

.bg-grid {
  position: fixed;
  inset: 0;
  background-image: 
    linear-gradient(var(--border-dim) 0.5px, transparent 0.5px),
    linear-gradient(90deg, var(--border-dim) 0.5px, transparent 0.5px);
  background-size: 50px 50px;
  opacity: 0.2;
  pointer-events: none;
  animation: drift 60s linear infinite;
}

@keyframes drift {
  0% { transform: translate(0, 0); }
  100% { transform: translate(50px, 50px); }
}

.content {
  position: relative;
  z-index: 2;
  max-width: 1400px;
  margin: 0 auto;
  padding: 1rem;
}

/* header */
.hero {
  text-align: center;
  padding: 2rem 1rem 1rem;
  border-bottom: 1px solid var(--border-dim);
  margin-bottom: 1.5rem;
}

.hero h1 {
  font-family: 'Space Grotesk', monospace;
  font-size: 2.5rem;
  background: linear-gradient(135deg, var(--gold), var(--accent-cyan));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  letter-spacing: -0.02em;
  text-shadow: 0 0 15px rgba(245,176,66,0.3);
}

.badge-live {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(45,212,191,0.12);
  border: 1px solid rgba(45,212,191,0.3);
  border-radius: 40px;
  padding: 0.2rem 1rem;
  font-size: 0.7rem;
  margin-top: 0.5rem;
  font-weight: 500;
}

.refresh-btn {
  margin-left: 12px;
  background: rgba(245,176,66,0.2);
  border: 1px solid var(--gold);
  color: var(--gold);
  border-radius: 40px;
  padding: 0.2rem 1rem;
  font-size: 0.7rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'Inter', sans-serif;
}

.refresh-btn:hover {
  background: var(--gold);
  color: black;
  box-shadow: 0 0 8px var(--gold);
}

.dot {
  width: 8px;
  height: 8px;
  background: var(--accent-cyan);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--accent-cyan);
  animation: pulse 1.8s infinite;
}

@keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

/* overall stats 2 rows */
.stats-2row {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  margin-bottom: 2rem;
}

.alltime-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 1px;
  background: var(--border-dim);
  border-radius: 20px;
  overflow: hidden;
}

.stat-brick {
  background: var(--bg-surface);
  padding: 1.2rem 0.5rem;
  text-align: center;
  backdrop-filter: blur(4px);
  transition: all 0.2s;
}

.stat-brick:hover {
  background: rgba(45,212,191,0.05);
}

.text-number, .stat-number {
  font-family: 'Space Grotesk', monospace;
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--gold);
  line-height: 1;
}

.stat-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--text-muted);
  margin-top: 6px;
}

.daily-team-stats {
  background: linear-gradient(145deg, var(--bg-card), var(--bg-surface));
  border-radius: 20px;
  border: 1px solid var(--border-dim);
  padding: 1rem;
}

.daily-title {
  font-size: 0.7rem;
  letter-spacing: 3px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 0.8rem;
}

.grid-columns {
  /* Restored default grid rules safely */
}

.daily-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.daily-metric {
  background: rgba(0,0,0,0.3);
  border-radius: 14px;
  padding: 0.6rem;
  text-align: center;
}

.daily-value {
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--accent-cyan);
}

/* TABS */
.tab-nav {
  display: flex;
  gap: 6px;
  background: var(--bg-surface);
  padding: 0.5rem;
  border-radius: 50px;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
  justify-content: center;
  border: 1px solid var(--border-dim);
}

.tab-btn {
  background: transparent;
  border: none;
  padding: 0.6rem 1.2rem;
  font-family: 'Space Grotesk', monospace;
  font-weight: 600;
  font-size: 0.8rem;
  color: var(--text-muted);
  border-radius: 40px;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 1px;
}

.tab-btn.active {
  background: var(--gold);
  color: #000;
  box-shadow: 0 0 12px rgba(245,176,66,0.6);
}

.ranking-panel {
  display: none;
  animation: fadeUp 0.4s ease;
}

.ranking-panel.active-panel {
  display: block;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* rank cards */
.rank-container {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 1rem;
}

.rank-card {
  background: var(--bg-card);
  border: 1px solid var(--border-dim);
  border-radius: 24px;
  transition: all 0.25s cubic-bezier(0.2,0.9,0.4,1.1);
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.rank-card:hover {
  transform: translateX(8px) scale(1.01);
  border-color: var(--gold);
  box-shadow: 0 12px 28px -8px rgba(0,0,0,0.5);
}

.rank-1 {
  background: linear-gradient(115deg, rgba(245,176,66,0.12), var(--bg-card));
  border-left: 4px solid var(--gold);
}
.rank-2 { border-left: 4px solid #b0b0b0; }
.rank-3 { border-left: 4px solid #cd7f32; }

.card-inner {
  display: flex;
  align-items: center;
  padding: 1rem;
  gap: 12px;
  flex-wrap: wrap;
}

.rank-number {
  font-family: 'Space Grotesk';
  font-weight: 800;
  font-size: 1.6rem;
  min-width: 48px;
  text-align: center;
  color: var(--text-muted);
}

.rank-1 .rank-number { color: var(--gold); text-shadow: 0 0 6px gold; }
.rank-2 .rank-number { color: #b0b0b0; }
.rank-3 .rank-number { color: #cd7f32; }

.avatar {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: 2px solid var(--gold);
  background: #1a1a2e;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.avatar-fallback {
  font-size: 1.5rem;
  font-weight: bold;
}

.user-info {
  flex: 2;
  min-width: 140px;
}

.user-name {
  font-weight: 700;
  font-size: 1rem;
}

.user-handle {
  font-size: 0.7rem;
  color: var(--text-muted);
  margin-top: 2px;
}

.engagement-stats {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  align-items: center;
}

.stat-badge {
  text-align: center;
  min-width: 55px;
}

.stat-badge .number {
  font-weight: 800;
  font-size: 0.9rem;
}
.stat-badge .label {
  font-size: 0.55rem;
  text-transform: uppercase;
  color: var(--text-muted);
}

.score-pill {
  background: rgba(245,176,66,0.2);
  padding: 0.2rem 0.7rem;
  border-radius: 60px;
  font-weight: 700;
  font-size: 0.75rem;
  border: 1px solid rgba(245,176,66,0.4);
}

/* progress bar */
.progress-bar {
  height: 3px;
  background: var(--border-dim);
  width: 100%;
}
.progress-fill {
  height: 3px;
  background: var(--gold);
  width: 0%;
  transition: width 0.6s ease;
}

/* awards */
.awards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px;
  margin: 1rem 0;
}
.award-card {
  background: var(--bg-card);
  border-radius: 20px;
  padding: 1rem;
  border: 1px solid var(--border-dim);
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all 0.2s;
}
.award-card:hover { transform: scale(1.02); background: #111128; }

/* modal */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  backdrop-filter: blur(12px);
  z-index: 1000;
  display: none;
  justify-content: center;
  align-items: center;
  padding: 1rem;
  overflow-y: auto;
}
.modal.open {
  display: flex;
}
.modal-content {
  background: var(--bg-surface);
  max-width: 700px;
  width: 100%;
  border-radius: 32px;
  border: 1px solid var(--border-dim);
  max-height: 85vh;
  overflow-y: auto;
  position: relative;
  animation: modalPop 0.3s;
}
@keyframes modalPop {
  from { opacity: 0; transform: scale(0.96); }
  to { opacity: 1; transform: scale(1); }
}

.modal-header {
  padding: 1.2rem;
  border-bottom: 1px solid var(--border-dim);
}
.post-list {
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}
.post-item {
  background: #0c0c1c;
  border-radius: 20px;
  padding: 0.8rem;
  border: 1px solid var(--border-dim);
}
.post-text {
  font-size: 0.85rem;
  margin-bottom: 8px;
}
.post-img {
  max-width: 100%;
  border-radius: 16px;
  margin: 8px 0;
}
.post-engagement {
  display: flex;
  gap: 12px;
  font-size: 0.7rem;
  margin-top: 10px;
  color: var(--accent-cyan);
}
.close-modal {
  position: sticky;
  top: 10px;
  left: 90%;
  background: var(--gold);
  border: none;
  width: 32px;
  height: 32px;
  border-radius: 30px;
  cursor: pointer;
  font-weight: bold;
}
.period-stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin: 1rem 0;
}
.period-card {
  background: #0c0c1c;
  border-radius: 20px;
  padding: 0.8rem;
  border: 1px solid var(--border-dim);
  text-align: center;
}
.period-title {
  font-weight: 700;
  font-size: 0.7rem;
  color: var(--gold);
  letter-spacing: 1px;
  margin-bottom: 6px;
}
.period-stat-row {
  font-size: 0.7rem;
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}
.today-summary {
  background: rgba(45,212,191,0.1);
  border-radius: 20px;
  padding: 0.8rem;
  margin-top: 1rem;
  text-align: center;
  border: 1px solid var(--accent-cyan);
}
</style>
</head>
<body>
<div class="bg-aura"></div>
<div class="bg-grid"></div>
<div class="content">
  <div class="hero">
    <h1>𝕏 COMMAND CENTER</h1>
    <div class="badge-live"><span class="dot"></span> LIVE DATA
      <button id="refreshDataBtn" class="refresh-btn">⟳ REFRESH DATA</button>
    </div>
  </div>

  <!-- All‑time overall stats -->
  <div class="stats-2row">
    <div class="alltime-stats" id="alltimeStats"></div>
    <div class="daily-team-stats" id="dailyOverall"></div>
  </div>

  <!-- Ranking Tabs -->
  <div class="tab-nav">
    <button class="tab-btn active" data-period="daily">📆 DAILY RANK</button>
    <button class="tab-btn" data-period="weekly">📊 WEEKLY RANK</button>
    <button class="tab-btn" data-period="monthly">📈 MONTHLY RANK</button>
    <button class="tab-btn" data-period="alltime">🏆 ALL-TIME</button>
    <button class="tab-btn" data-period="awards">🎖 AWARDS</button>
  </div>

  <div id="dailyPanel" class="ranking-panel active-panel">
    <div class="rank-container" id="dailyRankList"></div>
  </div>
  <div id="weeklyPanel" class="ranking-panel"></div>
  <div id="monthlyPanel" class="ranking-panel"></div>
  <div id="alltimePanel" class="ranking-panel"></div>
  <div id="awardsPanel" class="ranking-panel">
    <div class="awards-grid" id="awardsContainer"></div>
  </div>

  <div style="text-align:center; margin-top: 2rem; padding:1rem; font-size:0.7rem; color: #4a4a6a;">
    🔮 Real-time analytics directly from X Live API | Click any card → full profile + post activity
  </div>
</div>

<div id="profileModal" class="modal">
  <div class="modal-content">
    <button class="close-modal" id="closeModalBtn">✕</button>
    <div id="modalDynamic"></div>
  </div>
</div>

<script>
const BEARER = "AAAAAAAAAAAAAAAAAAAAALeV9gEAAAAAuX5QA3jwd0G3TyB7C5fVwkqIx24%3Dxy64eGFbzC7SzRBPApsUJUy1CXkleLPhGJXyvbp3SfsSnMeKoe";
const HANDLES = ["zbriefkani","haidari_ii","K992Zhraa","shang_salar","fenk24","adamrizgar","mohammed_fayeqA","ahmed_hazharr","safinbarzany","MEJPUK"];
let teamData = [];
let enrichedData = [];

// FIXED: Now accurately targets 'public_metrics' nested properties sent by the X v2 API payload 
function generateMockEngagement(user, seedOffset = 0) {
  const liveTweets = user.tweets || [];
  const now = new Date();
  
  const oneDay = 24 * 60 * 60 * 1000;
  const sevenDays = 7 * oneDay;
  const thirtyDays = 30 * oneDay;

  let daily = { posts: 0, likes: 0, comments: 0, score: 0 };
  let weekly = { posts: 0, likes: 0, comments: 0, score: 0 };
  let monthly = { posts: 0, likes: 0, comments: 0, score: 0 };
  let alltime = { posts: 0, likes: 0, comments: 0, score: 0 };

  liveTweets.forEach(t => {
    const tDate = new Date(t.created_at);
    const diff = now - tDate;

    // Fixed mapping check to safely target nested X API data properties
    const tweetLikes = t.public_metrics?.like_count ?? t.like_count ?? 0;
    const tweetComments = t.public_metrics?.reply_count ?? t.reply_count ?? 0;

    alltime.posts++;
    alltime.likes += tweetLikes;
    alltime.comments += tweetComments;

    if (diff <= oneDay) {
      daily.posts++; 
      daily.likes += tweetLikes; 
      daily.comments += tweetComments;
    }
    if (diff <= sevenDays) {
      weekly.posts++; 
      weekly.likes += tweetLikes; 
      weekly.comments += tweetComments;
    }
    if (diff <= thirtyDays) {
      monthly.posts++; 
      monthly.likes += tweetLikes; 
      monthly.comments += tweetComments;
    }
  });

  if (alltime.posts === 0) {
    alltime.posts = user.public_metrics?.tweet_count || 0;
  }

  daily.score = (daily.likes * 2) + (daily.comments * 3) + (daily.posts * 5);
  weekly.score = (weekly.likes * 2) + (weekly.comments * 3) + (weekly.posts * 5);
  monthly.score = (monthly.likes * 2) + (monthly.comments * 3) + (monthly.posts * 5);
  alltime.score = (alltime.likes * 2) + (alltime.comments * 3) + (alltime.posts * 5);

  return { daily, weekly, monthly, alltime };
}

async function fetchUsers() {
  try {
    const res = await fetch('/.netlify/functions/xapi');
    if(!res.ok) throw new Error('API fail');
    const json = await res.json();
    if(json.data) return json.data;
    throw new Error('no data');
  } catch(e) {
    console.warn(e);
    return null;
  }
}

function enrichWithMock(users) {
  return users.map((u, idx) => {
    const mock = generateMockEngagement(u, idx);
    return { ...u, engagement: mock };
  });
}

function refreshAllData() {
  if(!teamData.length) return;
  enrichedData = enrichWithMock(teamData);
  renderOverallStats();
  renderRanking('daily', 'dailyRankList');
  renderRanking('weekly', 'weeklyPanel');
  renderRanking('monthly', 'monthlyPanel');
  renderRanking('alltime', 'alltimePanel');
  renderAwards();
}

function renderOverallStats() {
  let totalLikes = 0, totalComments = 0, totalFollowers = 0;
  enrichedData.forEach(u => {
    totalLikes += u.engagement.alltime.likes;
    totalComments += u.engagement.alltime.comments;
    totalFollowers += (u.public_metrics?.followers_count || 0);
  });
  const alltimeHtml = `
    <div class="stat-brick"><div class="stat-number">${formatNumber(totalFollowers)}</div><div class="stat-label">TOTAL FOLLOWERS</div></div>
    <div class="stat-brick"><div class="stat-number">${formatNumber(totalLikes)}</div><div class="stat-label">TIMELINE LIKES</div></div>
    <div class="stat-brick"><div class="stat-number">${formatNumber(totalComments)}</div><div class="stat-label">TIMELINE COMMENTS</div></div>
  `;
  document.getElementById('alltimeStats').innerHTML = alltimeHtml;
  
  let dailyLikesSum = 0, dailyCommentsSum = 0, dailyPostsSum = 0;
  enrichedData.forEach(u => {
    dailyLikesSum += u.engagement.daily.likes;
    dailyCommentsSum += u.engagement.daily.comments;
    dailyPostsSum += u.engagement.daily.posts;
  });
  document.getElementById('dailyOverall').innerHTML = `
    <div class="daily-title">⚡ TEAM DAILY METRICS</div>
    <div class="daily-grid">
      <div class="daily-metric"><div class="daily-value">+${dailyPostsSum}</div><div class="stat-label">POSTS TODAY</div></div>
      <div class="daily-metric"><div class="daily-value">+${dailyLikesSum}</div><div class="stat-label">LIKES TODAY</div></div>
      <div class="daily-metric"><div class="daily-value">+${dailyCommentsSum}</div><div class="stat-label">COMMENTS</div></div>
    </div>
  `;
}

function getRanking(periodKey) {
  return [...enrichedData].sort((a,b) => b.engagement[periodKey].score - a.engagement[periodKey].score);
}

function renderRanking(periodKey, containerId) {
  const sorted = getRanking(periodKey);
  let target = document.getElementById(containerId);
  if(!target) return;
  
  if (containerId.endsWith('Panel')) {
    target.innerHTML = '<div class="rank-container"></div>';
    target = target.querySelector('.rank-container');
  } else {
    target.innerHTML = '';
  }

  sorted.forEach((user, idx) => {
    const eng = user.engagement[periodKey];
    const rankClass = idx === 0 ? 'rank-1' : idx === 1 ? 'rank-2' : idx === 2 ? 'rank-3' : '';
    const avatarUrl = user.profile_image_url?.replace('_normal', '_bigger') || '';
    const name = user.name || user.username;
    const handle = user.username;
    const card = document.createElement('div');
    card.className = `rank-card ${rankClass}`;
    card.style.cursor = 'pointer';
    card.onclick = () => openProfileModal(user, periodKey);
    card.innerHTML = `
      <div class="card-inner">
        <div class="rank-number">${idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx+1}`}</div>
        <div class="avatar">
          ${avatarUrl ? `<img src="${avatarUrl}" onerror="this.src=''" />` : `<div class="avatar-fallback">${name[0]}</div>`}
        </div>
        <div class="user-info">
          <div class="user-name">${escapeHtml(name)}</div>
          <div class="user-handle">@${handle}</div>
          <a href="https://x.com/${handle}" target="_blank" style="font-size:9px; color:var(--accent-cyan); text-decoration:none;" onclick="event.stopPropagation()">↗ X profile</a>
        </div>
        <div class="engagement-stats">
          <div class="stat-badge"><div class="number">${eng.posts}</div><div class="label">📝 Posts</div></div>
          <div class="stat-badge"><div class="number">${eng.likes}</div><div class="label">❤️ Likes</div></div>
          <div class="stat-badge"><div class="number">${eng.comments}</div><div class="label">💬 Comments</div></div>
          <div class="score-pill">${eng.score} pts</div>
        </div>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width: ${Math.min(100, (eng.score / (sorted[0].engagement[periodKey].score || 1))*100)}%"></div></div>
    `;
    target.appendChild(card);
  });
}

function renderAwards() {
  const periods = ['daily','weekly','monthly','alltime'];
  const awardList = [];
  periods.forEach(p => {
    const sorted = getRanking(p);
    if(sorted[0]) awardList.push({ period: p, winner: sorted[0], score: sorted[0].engagement[p].score });
  });
  
  const mostLiked = [...enrichedData].sort((a,b) => b.engagement.alltime.likes - a.engagement.alltime.likes)[0];
  const mostPosted = [...enrichedData].sort((a,b) => (b.public_metrics?.tweet_count || 0) - (a.public_metrics?.tweet_count || 0))[0];
  const mostActive = [...enrichedData].sort((a,b) => b.engagement.alltime.score - a.engagement.alltime.score)[0];
  const mostComments = [...enrichedData].sort((a,b) => b.engagement.alltime.comments - a.engagement.alltime.comments)[0];
  
  const extraAwards = [
    { icon: "🏆", title: "Most Liked (All-Time)", winner: mostLiked, value: mostLiked?.engagement.alltime.likes, suffix: "likes" },
    { icon: "📝", title: "Most Posted (All-Time)", winner: mostPosted, value: mostPosted?.public_metrics?.tweet_count, suffix: "posts" },
    { icon: "⚡", title: "Most Active (All-Time)", winner: mostActive, value: mostActive?.engagement.alltime.score, suffix: "pts" },
    { icon: "💬", title: "Most Comments (All-Time)", winner: mostComments, value: mostComments?.engagement.alltime.comments, suffix: "comments" }
  ];
  
  const container = document.getElementById('awardsContainer');
  container.innerHTML = `
    <div style="grid-column: 1/-1; margin-bottom: 0.5rem;"><h3 style="color: var(--gold);">🏅 Period Winners</h3></div>
    ${awardList.map(aw => `
      <div class="award-card">
        <div style="font-size:2rem;">${aw.period === 'daily' ? '🏅' : aw.period === 'weekly' ? '⚡' : aw.period === 'monthly' ? '🌟' : '👑'}</div>
        <div><strong>${escapeHtml(aw.winner.name || aw.winner.username)}</strong><br><span style="font-size:0.7rem;">Top ${aw.period.toUpperCase()} · ${aw.score} pts</span></div>
      </div>
    `).join('')}
    <div style="grid-column: 1/-1; margin: 1rem 0 0.5rem 0;"><h3 style="color: var(--accent-cyan);">🏆 All‑Time Special Awards</h3></div>
    ${extraAwards.map(aw => `
      <div class="award-card">
        <div style="font-size:2rem;">${aw.icon}</div>
        <div><strong>${escapeHtml(aw.winner?.name || aw.winner?.username || "—")}</strong><br><span style="font-size:0.7rem;">${aw.title}<br>${aw.value?.toLocaleString()} ${aw.suffix}</span></div>
      </div>
    `).join('')}
  `;
}

async function fetchUserTweets(userId) {
  const targetUser = enrichedData.find(u => u.id === userId);
  if(targetUser && targetUser.tweets) {
    return { data: targetUser.tweets };
  }
  return null;
}

async function openProfileModal(user, activePeriod) {
  const allEng = user.engagement;
  const avatarUrl = user.profile_image_url?.replace('_normal', '_bigger') || '';
  const periods = ['daily', 'weekly', 'monthly', 'alltime'];
  const periodCardsHtml = periods.map(p => {
    const eng = allEng[p];
    const periodName = p.charAt(0).toUpperCase() + p.slice(1);
    return `
      <div class="period-card">
        <div class="period-title">${periodName}</div>
        <div class="period-stat-row">
          <span>📝 ${eng.posts}</span>
          <span>❤️ ${eng.likes}</span>
          <span>💬 ${eng.comments}</span>
        </div>
      </div>
    `;
  }).join('');
  
  const modalDiv = document.getElementById('modalDynamic');
  modalDiv.innerHTML = `
    <div style="padding:1rem;">
      <div style="display:flex; gap:16px; align-items:center; margin-bottom:1rem;">
        <div class="avatar" style="width:70px;height:70px;">${avatarUrl ? `<img src="${avatarUrl}">` : `<div class="avatar-fallback">${(user.name||'U')[0]}</div>`}</div>
        <div><h2>${escapeHtml(user.name || user.username)}</h2><div>@${user.username}</div></div>
      </div>
      <h4 style="margin: 1rem 0 0.5rem 0;">📊 Engagement Breakdown (Posts, Likes, Comments)</h4>
      <div class="period-stats-grid">${periodCardsHtml}</div>
      <div style="text-align:center; padding:2rem;">⏳ Loading today's posts from X...</div>
    </div>
  `;
  document.getElementById('profileModal').classList.add('open');
  
  const tweetData = await fetchUserTweets(user.id);
  let postsHtml = '';
  let todayPostCount = 0;
  let todayLikes = 0, todayComments = 0;
  
  if (tweetData && tweetData.data && tweetData.data.length) {
    for (const tweet of tweetData.data) {
      // FIXED: Also corrected metric targeting when parsing single profile tweet logs inside the modal view
      const tLikes = tweet.public_metrics?.like_count ?? tweet.like_count ?? 0;
      const tComments = tweet.public_metrics?.reply_count ?? tweet.reply_count ?? 0;

      todayPostCount++;
      todayLikes += tLikes;
      todayComments += tComments;
      
      let mediaHtml = '';
      if (tweet.media_url) {
        mediaHtml = `<img class="post-img" src="${tweet.media_url}" />`;
      }
      postsHtml += `
        <div class="post-item">
          <div class="post-text">${escapeHtml(tweet.text)}</div>
          ${mediaHtml}
          <div class="post-engagement">❤️ ${tLikes} · 💬 ${tComments}</div>
        </div>
      `;
    }
    if (todayPostCount === 0) {
      postsHtml = `<div style="padding:1rem; text-align:center;">📭 No posts from today.</div>`;
    }
  } else {
    postsHtml = `<div style="padding:1rem; text-align:center;">⚠️ User has no recent live tweets recorded today.</div>`;
  }
  
  const summaryHtml = (todayPostCount > 0) ? `
    <div class="today-summary">
      <strong>📅 Today's Summary</strong><br>
      📝 ${todayPostCount} posts &nbsp;|&nbsp;
      ❤️ ${todayLikes} likes &nbsp;|&nbsp;
      💬 ${todayComments} comments
    </div>
  ` : '';
  
  const finalHtml = `
    <div style="padding:1rem;">
      <div style="display:flex; gap:16px; align-items:center; margin-bottom:1rem;">
        <div class="avatar" style="width:70px;height:70px;">${avatarUrl ? `<img src="${avatarUrl}">` : `<div class="avatar-fallback">${(user.name||'U')[0]}</div>`}</div>
        <div><h2>${escapeHtml(user.name || user.username)}</h2><div>@${user.username}</div></div>
      </div>
      <h4 style="margin: 1rem 0 0.5rem 0;">📊 Engagement Breakdown (Posts, Likes, Comments)</h4>
      <div class="period-stats-grid">${periodCardsHtml}</div>
      <h4 style="margin: 1rem 0 0.5rem 0;">📝 What @${user.username} posted today</h4>
      <div class="post-list">
        ${postsHtml}
      </div>
      ${summaryHtml}
      <a href="https://x.com/${user.username}" target="_blank" style="display:block; margin:1rem 0; text-align:center; color:var(--gold);">🔗 Visit @${user.username} on X</a>
    </div>
  `;
  modalDiv.innerHTML = finalHtml;
}

function escapeHtml(str) {
  if(!str) return '';
  return str.replace(/[&<>]/g, function(m) {
    if(m === '&') return '&amp;';
    if(m === '<') return '&lt;';
    if(m === '>') return '&gt;';
    return m;
  });
}

function formatNumber(n) { return n > 999999 ? (n/1000000).toFixed(1)+'M' : n > 999 ? (n/1000).toFixed(1)+'K' : n; }

function switchTab(period) {
  document.querySelectorAll('.ranking-panel').forEach(p => p.classList.remove('active-panel'));
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  
  const targetedPanelMap = {
    'daily': 'dailyPanel',
    'weekly': 'weeklyPanel',
    'monthly': 'monthlyPanel',
    'alltime': 'alltimePanel',
    'awards': 'awardsPanel'
  };
  
  const targetId = targetedPanelMap[period];
  const targetDom = document.getElementById(targetId);
  if (targetDom) {
    targetDom.classList.add('active-panel');
    
    if (period === 'daily') renderRanking('daily', 'dailyRankList');
    if (period === 'weekly') renderRanking('weekly', 'weeklyPanel');
    if (period === 'monthly') renderRanking('monthly', 'monthlyPanel');
    if (period === 'alltime') renderRanking('alltime', 'alltimePanel');
  }
  
  const activeBtn = [...document.querySelectorAll('.tab-btn')].find(b => b.dataset.period === period);
  if(activeBtn) activeBtn.classList.add('active');
}

async function init() {
  const users = await fetchUsers();
  if(users && users.length) {
    teamData = users;
    enrichedData = enrichWithMock(teamData);
    renderOverallStats();
    renderRanking('daily', 'dailyRankList');
    renderAwards();
  } else {
    document.getElementById('dailyRankList').innerHTML = '<div style="padding:2rem;">Failed to fetch users. Check Lambda.</div>';
  }
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    switchTab(btn.dataset.period);
  });
});
document.getElementById('closeModalBtn')?.addEventListener('click', () => document.getElementById('profileModal').classList.remove('open'));
document.getElementById('profileModal')?.addEventListener('click', (e) => { if(e.target === document.getElementById('profileModal')) document.getElementById('profileModal').classList.remove('open'); });
document.getElementById('refreshDataBtn')?.addEventListener('click', () => refreshAllData());

init();
setInterval(() => { if(enrichedData.length) refreshAllData(); }, 3600000);
</script>

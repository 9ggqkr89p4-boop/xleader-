<script>
// Your exact color array and user handles
const COLORS = ["#FFD700", "#00C6FF", "#FF6B9D", "#7C3AED", "#10B981", "#F97316", "#06B6D4", "#84CC16", "#F59E0B"];
const HANDLES = ["zbriefkani", "haidari_ii", "K992Zhraa", "shang_salar", "fenk24", "adamrizgar", "mohammed_fayeqA", "ahmed_hazharr", "safinbarzany"];

let teamData = [];
let sortKey = "tweets"; // Default active tab is Posts

// Updated dynamic score formula using only TODAY's live momentum metrics
function calculateDailyScore(posts, likes, comments) {
    return (posts * 10) + (likes * 2) + (comments * 5);
}

function setSort(key, el) {
    sortKey = key;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    if (el) el.classList.add('active');
    renderBoard();
}

async function fetchAll() {
    const btn = document.getElementById('refresh-btn');
    btn.disabled = true;
    btn.textContent = '↻ LOADING...';
    document.getElementById('board').innerHTML = '<div class="loading"><div class="spinner"></div><div class="loading-text">Fetching Live Stats...</div></div>';
    
    try {
        // Calculate your current local date format (YYYY-MM-DD)
        const localDate = new Date();
        const offset = localDate.getTimezoneOffset();
        const localTodayStr = new Date(localDate.getTime() - (offset * 60 * 1000)).toISOString().split('T')[0];

        let totalTeamDailyPosts = 0;
        let totalTeamFollowers = 0;
        let freshTeamData = [];

        // Loop over each user to aggregate their individual timeline tweets for TODAY
        for (let i = 0; i < HANDLES.length; i++) {
            const username = HANDLES[i];
            
            // Appending a timestamp bypasses Netlify edge caching for a true live refresh
            const res = await fetch(`/.netlify/functions/xapi?username=${username}&t=${Date.now()}`, { cache: "no-store" });
            if (!res.ok) throw new Error('Server error: ' + res.status);
            
            const result = await res.json();
            if (result.error) throw new Error(result.error);

            let dailyPosts = 0;
            let dailyLikes = 0;
            let dailyComments = 0;
            let currentFollowers = result.user_metrics?.followers_count || 0;

            // Target the public metrics payload specifically for items posted TODAY
            if (result.tweets && result.tweets.data) {
                result.tweets.data.forEach(tweet => {
                    const tweetDateLocal = new Date(tweet.created_at).toLocaleDateString('en-CA'); // Outputs YYYY-MM-DD
                    
                    if (tweetDateLocal === localTodayStr) {
                        dailyPosts += 1;
                        dailyLikes += tweet.public_metrics?.like_count || 0;
                        dailyComments += tweet.public_metrics?.reply_count || 0;
                    }
                });
            }

            totalTeamDailyPosts += dailyPosts;
            totalTeamFollowers += currentFollowers;

            freshTeamData.push({
                username: username,
                name: result.user_metrics?.name || username,
                profile_image_url: result.user_metrics?.profile_image_url || null,
                color: COLORS[i % COLORS.length],
                followers: currentFollowers,
                daily_posts: dailyPosts,
                daily_likes: dailyLikes,
                daily_comments: dailyComments,
                daily_score: calculateDailyScore(dailyPosts, dailyLikes, dailyComments)
            });
        }

        teamData = freshTeamData;

        // Update the top UI global stats boxes
        document.getElementById('s-posts').textContent = totalTeamDailyPosts.toLocaleString();
        document.getElementById('s-followers').textContent = totalTeamFollowers >= 1000 ? (totalTeamFollowers / 1000).toFixed(1) + 'K' : totalTeamFollowers;
        
        renderBoard();

        const now = new Date();
        const currentTimeString = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('last-updated').textContent = 'Updated: ' + currentTimeString;
        document.getElementById('s-updated').textContent = currentTimeString;
        
        // Update local memory cache
        localStorage.setItem('xleader_cache', JSON.stringify({ data: teamData, ts: now.toISOString() }));
    } catch (e) {
        document.getElementById('board').innerHTML = '<div class="error-box"><b>ERROR: </b>' + e.message + '</div>';
    }
    
    btn.disabled = false;
    btn.textContent = '↻ REFRESH';
}

function renderBoard() {
    if (!teamData.length) return;
    const board = document.getElementById('board');
    board.innerHTML = '';

    // Sort users dynamically depending on which top navigation tab is clicked
    const sorted = [...teamData].sort((a, b) => {
        if (sortKey === 'tweets') return b.daily_posts - a.daily_posts;
        if (sortKey === 'followers') return b.followers - a.followers;
        return b.daily_score - a.daily_score;
    });

    // Determine the highest value on the screen to calculate the visual progress bar width correctly
    const maxVal = sorted.length > 0 ? (
        sortKey === 'tweets' ? (sorted[0].daily_posts || 1) : 
        sortKey === 'followers' ? (sorted[0].followers || 1) : 
        (sorted[0].daily_score || 1)
    ) : 1;

    sorted.forEach((u, idx) => {
        const rc = idx === 0 ? 'gold' : idx === 1 ? 'silver' : idx === 2 ? 'bronze' : '';
        const rl = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '#' + (idx + 1);
        const rt = idx === 0 ? 'r1' : idx === 1 ? 'r2' : idx === 2 ? 'r3' : 'rn';
        
        // Define active visual value for progress line
        const currentActiveVal = sortKey === 'tweets' ? u.daily_posts : sortKey === 'followers' ? u.followers : u.daily_score;
        const progressPercent = Math.min(100, Math.round((currentActiveVal / maxVal) * 100));
        
        const followerDisplay = u.followers >= 1000 ? ((u.followers / 1000).toFixed(1) + 'K') : u.followers;
        const img = u.profile_image_url ? u.profile_image_url.replace('_normal', '_bigger') : null;

        const card = document.createElement('div');
        card.className = 'card ' + rc;
        card.innerHTML = `
            <div class="card-row">
                <div class="rank ${rt}">${rl}</div>
                <div class="avatar" style="border-color:${u.color}55">
                    ${img ? `<img src="${img}" onerror="this.style.display='none'">` : ''}
                    <span class="avatar-letter" style="${img ? 'display:none' : ''}; color:${u.color}">
                        ${u.name[0].toUpperCase()}
                    </span>
                </div>
                <div class="info">
                    <div class="name">${u.name}</div>
                    <div class="handle">@${u.username}</div>
                </div>
                <div class="metrics">
                    <div class="metric">
                        <div class="metric-v ${sortKey === 'tweets' ? 'hi' : ''}">${u.daily_posts}</div>
                        <div class="metric-k">posts</div>
                    </div>
                    <div class="metric">
                        <div class="metric-v">${u.daily_likes}</div>
                        <div class="metric-k">likes</div>
                    </div>
                    <div class="metric">
                        <div class="metric-v">${u.daily_comments}</div>
                        <div class="metric-k">comments</div>
                    </div>
                    <div class="score-tag">${Math.round(u.daily_score)} PTS</div>
                </div>
            </div>
            <div class="bar-track">
                <div class="bar-fill" style="width:${progressPercent}%; background:${u.color}"></div>
            </div>
        `;
        board.appendChild(card);
    });
}

// Initial App Activation
window.addEventListener('load', () => {
    try {
        const cached = localStorage.getItem('xleader_cache');
        if (cached) {
            const { data, ts } = JSON.parse(cached);
            // If the cache is fresh and belongs to the current day, use it. Otherwise, force update.
            const cacheDate = new Date(ts).toLocaleDateString('en-CA');
            const currentDate = new Date().toLocaleDateString('en-CA');
            
            if (cacheDate === currentDate) {
                teamData = data;
                renderBoard();
                const cachedTime = new Date(ts).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                document.getElementById('last-updated').textContent = 'Cached: ' + cachedTime;
                document.getElementById('s-updated').textContent = cachedTime;
                return;
            }
        }
    } catch (e) { console.error("Cache read error:", e); }
    fetchAll();
});

// Auto-run routine once every single hour to keep background processes warm
setInterval(fetchAll, 60 * 60 * 1000);
</script>
</body>
</html>

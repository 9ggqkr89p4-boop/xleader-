<!DOCTYPE html>
<html lang="en" class="bg-slate-950 text-slate-100 overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X Matrix Alpha - Leaderboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    .glassmorphism {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    .neon-text-glow {
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
    }
    #canvas3d {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <canvas id="canvas3d"></canvas>

  <div class="max-w-7xl mx-auto px-4 py-8 relative z-10">
    
    <header class="flex flex-col md:flex-row justify-between items-center mb-12 pb-6 border-b border-slate-800/60 gap-6">
      <div>
        <h1 class="text-4xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-sky-400 via-indigo-400 to-purple-500 uppercase">
          X Matrix Alpha
        </h1>
        <p class="text-slate-400 text-sm font-medium tracking-wider mt-1">REALTIME 10-MEMBER PERFORMANCE CORE</p>
      </div>

      <div class="inline-flex glassmorphism p-1.5 rounded-xl border border-slate-700/50 shadow-2xl">
        <button onclick="switchTimeframe('today')" id="btn-today" class="px-5 py-2.5 rounded-lg text-xs font-bold uppercase tracking-wider transition-all duration-300 bg-sky-500 text-slate-950 shadow-lg">Today</button>
        <button onclick="switchTimeframe('weekly')" id="btn-weekly" class="px-5 py-2.5 rounded-lg text-xs font-bold uppercase tracking-wider transition-all duration-300 text-slate-400 hover:text-white">Weekly</button>
        <button onclick="switchTimeframe('monthly')" id="btn-monthly" class="px-5 py-2.5 rounded-lg text-xs font-bold uppercase tracking-wider transition-all duration-300 text-slate-400 hover:text-white">Monthly</button>
        <button onclick="switchTimeframe('yearly')" id="btn-yearly" class="px-5 py-2.5 rounded-lg text-xs font-bold uppercase tracking-wider transition-all duration-300 text-slate-400 hover:text-white">Yearly</button>
      </div>
    </header>

    <section id="podium-container" class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-12 items-end">
      </section>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <div class="lg:col-span-2 space-y-3" id="ranks-container">
        </div>

      <div class="glassmorphism rounded-2xl p-6 flex flex-col justify-between h-fit min-h-[420px]">
        <div>
          <h3 class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-1">Volume Aggregation</h3>
          <h2 class="text-lg font-bold text-white mb-6">Distribution Comparison Matrix</h2>
        </div>
        <div class="relative w-full h-64">
          <canvas id="matrixChart"></canvas>
        </div>
      </div>

    </div>
  </div>

  <div id="profile-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300 p-4">
    <div class="glassmorphism w-full max-w-2xl rounded-3xl overflow-hidden shadow-2xl border border-slate-700/80 transform scale-95 transition-transform duration-300 flex flex-col max-h-[90vh]">
      <div class="p-6 border-b border-slate-800 flex justify-between items-start bg-slate-900/40">
        <div class="flex items-center gap-4">
          <img id="modal-avatar" src="" alt="Avatar" class="w-16 h-16 rounded-2xl border-2 border-sky-400/30 object-cover shadow-xl">
          <div>
            <h2 id="modal-name" class="text-2xl font-bold text-white">---</h2>
            <p id="modal-handle" class="text-sky-400 text-sm font-medium">@---</p>
          </div>
        </div>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white text-xl p-2 bg-slate-800/40 hover:bg-slate-800 rounded-xl transition-all">✕</button>
      </div>

      <div class="p-6 overflow-y-auto space-y-6 flex-1">
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
          <div class="bg-slate-900/60 border border-slate-800 p-4 rounded-2xl text-center">
            <span class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Posts</span>
            <span id="modal-posts" class="text-xl font-black text-white">0</span>
          </div>
          <div class="bg-slate-900/60 border border-slate-800 p-4 rounded-2xl text-center">
            <span class="block text-xs font-bold text-pink-400 uppercase tracking-wider mb-1">Likes</span>
            <span id="modal-likes" class="text-xl font-black text-white">0</span>
          </div>
          <div class="bg-slate-900/60 border border-slate-800 p-4 rounded-2xl text-center">
            <span class="block text-xs font-bold text-purple-400 uppercase tracking-wider mb-1">Comments</span>
            <span id="modal-comments" class="text-xl font-black text-white">0</span>
          </div>
          <div class="bg-slate-900/60 border border-slate-800 p-4 rounded-2xl text-center">
            <span class="block text-xs font-bold text-emerald-400 uppercase tracking-wider mb-1">Shares</span>
            <span id="modal-shares" class="text-xl font-black text-white">0</span>
          </div>
        </div>

        <div class="border border-slate-800/80 rounded-2xl p-4 bg-slate-950/40 space-y-4">
          <div class="flex items-center gap-2 text-xs text-slate-400 font-semibold tracking-wider uppercase">
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Latest Broadcast Feed Post
          </div>
          <p id="modal-post-text" class="text-slate-200 text-sm leading-relaxed"></p>
          <img id="modal-post-img" src="" alt="Post Visual Attachment" class="w-full h-48 object-cover rounded-xl border border-slate-800">
        </div>
      </div>
    </div>
  </div>

  <script>
    let globalDataStore = [];
    let currentTimeframe = 'today';
    let distributionChartInstance = null;

    // --- 1. INITIALIZE THREE.JS 3D PARTICLE AMBIENT BACKGROUND SYSTEM ---
    const canvas = document.getElementById('canvas3d');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
    
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const particlesGeometry = new THREE.BufferGeometry();
    const count = 120;
    const positions = new Float32Array(count * 3);

    for(let i = 0; i < count * 3; i++) {
      positions[i] = (Math.random() - 0.5) * 12;
    }
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const particlesMaterial = new THREE.PointsMaterial({
      size: 0.04,
      color: 0x38bdf8,
      transparent: true,
      opacity: 0.4,
      blending: THREE.AdditiveBlending
    });

    const particleMesh = new THREE.Points(particlesGeometry, particlesMaterial);
    scene.add(particleMesh);
    camera.position.z = 4;

    function animate3DEngine() {
      requestAnimationFrame(animate3DEngine);
      particleMesh.rotation.y += 0.0012;
      particleMesh.rotation.x += 0.0006;
      renderer.render(scene, camera);
    }
    animate3DEngine();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 2. ENGINE SYSTEM LOGIC AND INTERACTION PIPELINES ---
    async function loadDashboardData() {
      try {
        // Pointing to your serverless backend gateway endpoint
        const response = await fetch('/api/get-x-data');
        if (!response.ok) throw new Error("API Route failure responding.");
        globalDataStore = await response.json();
        renderDashboard();
      } catch (err) {
        console.warn("Fallback to Local Core Mock Framework for offline asset rendering optimization.", err);
        generateMockFallbackEngine();
      }
    }

    function switchTimeframe(timeframe) {
      currentTimeframe = timeframe;
      ['today', 'weekly', 'monthly', 'yearly'].forEach(tf => {
        const btn = document.getElementById(`btn-${tf}`);
        if(tf === timeframe) {
          btn.className = "px-5 py-2.5 rounded-lg text-xs font-bold uppercase tracking-wider transition-all duration-300 bg-sky-500 text-slate-950 shadow-lg";
        } else {
          btn.className = "px-5 py-2.5 rounded-lg text-xs font-bold uppercase tracking-wider transition-all duration-300 text-slate-400 hover:text-white";
        }
      });
      renderDashboard();
    }

    function renderDashboard() {
      // Sort data structural arrays by dynamic metrics properties
      const sorted = [...globalDataStore].sort((a, b) => b.metrics[currentTimeframe].points - a.metrics[currentTimeframe].points);
      
      // Separate array to render podium versus sub-stacks rows
      const podium = sorted.slice(0, 3);
      const remaining = sorted.slice(3);

      renderPodium(podium);
      renderRanks(remaining, sorted);
      updateChartMatrix(sorted);
    }

    function renderPodium(topThree) {
      const podiumContainer = document.getElementById('podium-container');
      podiumContainer.innerHTML = '';

      // Podium absolute sequence grid maps array indexes logically [1, 0, 2] to position Rank 1 center visually
      const positionMap = [topThree[1], topThree[0], topThree[2]];
      
      positionMap.forEach((user) => {
        if (!user) return;
        const indexInMain = topThree.indexOf(user);
        const rankNumber = indexInMain + 1;
        const metrics = user.metrics[currentTimeframe];

        let tierColor = "border-slate-700 text-slate-400";
        let heightClass = "h-48";
        if (rankNumber === 1) { tierColor = "border-amber-400 text-amber-400"; heightClass = "h-60 ring-2 ring-amber-400/20"; }
        if (rankNumber === 2) { tierColor = "border-slate-300 text-slate-200"; heightClass = "h-52"; }
        if (rankNumber === 3) { tierColor = "border-amber-700 text-amber-600"; heightClass = "h-44"; }

        const card = document.createElement('div');
        card.className = `glassmorphism rounded-2xl p-6 flex flex-col justify-between items-center relative transition-all duration-500 hover:-translate-y-2 cursor-pointer ${heightClass} ${tierColor.split(' ')[0]}`;
        card.onclick = () => openModal(user.id);
        
        card.innerHTML = `
          <div class="absolute -top-5 left-1/2 transform -translate-x-1/2 w-10 h-10 rounded-full flex items-center justify-center font-black glassmorphism border-2 ${tierColor}">
            ${rankNumber}
          </div>
          <div class="text-center mt-2">
            <img src="${user.avatar}" alt="${user.name}" class="w-14 h-14 rounded-full mx-auto border-2 border-slate-700/60 object-cover shadow-lg">
            <h3 class="font-bold text-white text-sm mt-2 tracking-wide truncate max-w-[160px]">${user.name}</h3>
            <p class="text-xs text-slate-400 font-mono">@${user.username}</p>
          </div>
          <div class="text-center w-full bg-slate-950/40 py-2 rounded-xl border border-slate-800/60">
            <span class="block text-[10px] uppercase font-bold tracking-widest text-slate-400">Score Matrix</span>
            <span class="text-base font-black ${rankNumber === 1 ? 'text-amber-400 neon-text-glow' : 'text-white'}">${Math.floor(metrics.points).toLocaleString()}</span>
          </div>
        `;
        podiumContainer.appendChild(card);
      });
    }

    function renderRanks(subMembers, fullSorted) {
      const container = document.getElementById('ranks-container');
      container.innerHTML = '';

      subMembers.forEach((user) => {
        const rankNumber = fullSorted.indexOf(user) + 1;
        const metrics = user.metrics[currentTimeframe];

        const row = document.createElement('div');
        row.className = "glassmorphism rounded-xl p-4 flex flex-col sm:flex-row justify-between items-center gap-4 cursor-pointer transition-all duration-300 hover:bg-slate-900/40 hover:border-slate-700/80";
        row.onclick = () => openModal(user.id);

        row.innerHTML = `
          <div class="flex items-center gap-4 w-full sm:w-auto">
            <span class="text-sm font-black text-slate-500 font-mono w-6 text-center">${rankNumber}</span>
            <img src="${user.avatar}" alt="${user.name}" class="w-10 h-10 rounded-xl object-cover border border-slate-800">
            <div>
              <h4 class="font-bold text-white text-sm tracking-wide">${user.name}</h4>
              <p class="text-xs text-slate-400 font-mono">@${user.username}</p>
            </div>
          </div>
          <div class="flex items-center justify-between sm:justify-end gap-6 w-full sm:w-auto text-right border-t sm:border-t-0 border-slate-800/80 pt-2 sm:pt-0">
            <div class="grid grid-cols-4 gap-4 text-center sm:text-right">
              <div><span class="block text-[9px] font-bold uppercase tracking-wider text-slate-500">Post</span><span class="text-xs font-bold text-slate-300">${metrics.posts}</span></div>
              <div><span class="block text-[9px] font-bold uppercase tracking-wider text-pink-500/70">Like</span><span class="text-xs font-bold text-slate-300">${metrics.likes}</span></div>
              <div><span class="block text-[9px] font-bold uppercase tracking-wider text-purple-500/70">Comm</span><span class="text-xs font-bold text-slate-300">${metrics.comments}</span></div>
              <div><span class="block text-[9px] font-bold uppercase tracking-wider text-emerald-500/70">Shar</span><span class="text-xs font-bold text-slate-300">${metrics.shares}</span></div>
            </div>
            <div class="bg-slate-950/60 border border-slate-800/80 px-4 py-1.5 rounded-lg min-w-[90px] text-center">
              <span class="text-xs font-mono font-black text-sky-400">${Math.floor(metrics.points).toLocaleString()}</span>
            </div>
          </div>
        `;
        container.appendChild(row);
      });
    }

    function updateChartMatrix(sortedData) {
      const ctx = document.getElementById('matrixChart').getContext('2d');
      const labels = sortedData.map(u => u.username);
      const pointsData = sortedData.map(u => u.metrics[currentTimeframe].points);

      if (distributionChartInstance) {
        distributionChartInstance.data.labels = labels;
        distributionChartInstance.data.datasets[0].data = pointsData;
        distributionChartInstance.update();
        return;
      }

      distributionChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Score Weight',
            data: pointsData,
            backgroundColor: 'rgba(56, 189, 248, 0.25)',
            borderColor: '#38bdf8',
            borderWidth: 2,
            borderRadius: 6,
            hoverBackgroundColor: 'rgba(99, 102, 241, 0.5)',
            hoverBorderColor: '#6366f1'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#64748b', font: { size: 10, family: 'monospace' } } },
            x: { grid: { display: false }, ticks: { color: '#64748b', font: { size: 9, family: 'monospace' } } }
          }
        }
      });
    }

    // --- 3. MODAL PROFILE COMPONENT ROUTER CONTROL ---
    function openModal(userId) {
      const user = globalDataStore.find(u => u.id === userId);
      if(!user) return;

      const metrics = user.metrics[currentTimeframe];
      
      document.getElementById('modal-avatar').src = user.avatar;
      document.getElementById('modal-name').innerText = user.name;
      document.getElementById('modal-handle').innerText = `@${user.username}`;
      
      document.getElementById('modal-posts').innerText = metrics.posts;
      document.getElementById('modal-likes').innerText = metrics.likes;
      document.getElementById('modal-comments').innerText = metrics.comments;
      document.getElementById('modal-shares').innerText = metrics.shares;
      
      document.getElementById('modal-post-text').innerText = user.latestPost.text;
      document.getElementById('modal-post-img').src = user.latestPost.image;

      const modal = document.getElementById('profile-modal');
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.add('opacity-100');
        modal.firstElementChild.classList.remove('scale-95');
      }, 50);
    }

    function closeModal() {
      const modal = document.getElementById('profile-modal');
      modal.classList.remove('opacity-100');
      modal.firstElementChild.classList.add('scale-95');
      setTimeout(() => modal.classList.add('hidden'), 300);
    }

    // --- 4. SECURE STANDBY ARCHITECTURAL SEED FALLBACK ---
    function generateMockFallbackEngine() {
      const handles = ["Zbriefkani", "haidari_ii", "K99Zhraa", "shang_salar", "fenk24", "adamrizgar", "Mohammed_FayeqA", "ahmed_hazharr", "safinbarzany", "MEJPUK"];
      globalDataStore = handles.map((username, i) => {
        const baseSeed = 20 + (i * 12);
        const dailyLikes = baseSeed + 12;
        const dailyComments = Math.floor(baseSeed / 3) + 2;
        const dailyRetweets = Math.floor(baseSeed / 4);
        const dailyShares = 2;
        const dailyPosts = 2;
        const todayPoints = (dailyLikes * 1) + (dailyComments * 3) + (dailyRetweets * 5) + (dailyShares * 4);

        return {
          id: `id-${i}`,
          name: username.replace('_', ' ').replace('ii', ''),
          username: username,
          avatar: `https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80`,
          metrics: {
            today: { points: todayPoints, posts: dailyPosts, likes: dailyLikes, comments: dailyComments, shares: dailyShares + dailyRetweets },
            weekly: { points: todayPoints * 7, posts: dailyPosts * 7, likes: dailyLikes * 7, comments: dailyComments * 7, shares: (dailyShares + dailyRetweets) * 7 },
            monthly: { points: todayPoints * 30, posts: dailyPosts * 30, likes: dailyLikes * 30, comments: dailyComments * 30, shares: (dailyShares + dailyRetweets) * 30 },
            yearly: { points: todayPoints * 365, posts: dailyPosts * 365, likes: dailyLikes * 365, comments: dailyComments * 365, shares: (dailyShares + dailyRetweets) * 365 }
          },
          latestPost: {
            text: "Testing production assets on the updated alpha system pipeline. Data components rendering perfectly ⚡️",
            image: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80",
            likes: dailyLikes, comments: dailyComments, shares: dailyRetweets + dailyShares
          }
        };
      });
      renderDashboard();
    }

    // Run Engine execution loop initialization
    loadDashboardData();
  </script>
</body>
</html>
